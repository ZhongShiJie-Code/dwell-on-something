<script>
/* 夜间模式：跟随系统 / 常亮 / 常暗，三态轮换，记在本地。
   写在 <style> 前面执行，页面还没画就把皮穿好，不会闪一下白的。
   规矩：反转的只有底色、卡片、线、字这些"纸和墨"；
   本家橘、身体粉这种有身份的颜色两种模式下都不动——它们是记号，不是背景。 */
(function () {
  try {
    var t = localStorage.getItem('homeTheme') || 'auto';
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<script>
/* 浏览器版注册离线壳；file:// 和 APK 内置 WebView 不需要这一层。 */
(function () {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
  });
})();
</script>
<style>

    --red: #c0392b;
    --amber: #e3a13a;

  }

      --sage: #A8C0A0; --sage-track: #3A423A; --pink-track: #4A3B34;
      --green: #6fbf85; --red: #e07a6a;
      --amber: #e8b45c; --amber-track: #4a4232; --red-track: #4d3a36;
      --overlay: rgba(0, 0, 0, .55);
    }
}
html[data-theme="dark"] {
      --bg: #262624; --card: #30302e; --panel: #383836; --line: #3d3d3a;
      --text: #f5f4ef; --dim: #a3a099; --user-bubble: #35353260;
      --sage: #A8C0A0; --sage-track: #3A423A; --pink-track: #4A3B34;
      --green: #6fbf85; --red: #e07a6a;

  @font-face {
    font-family: SerifNum;
    src: local("Helvetica Neue"), local("Helvetica");
    unicode-range: U+0030-0039, U+002F, U+002E, U+003A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    overflow-x: hidden; max-width: 100vw;   
    background: var(--bg); color: var(--text);
    font-family: var(--sans);

  #toastLane {

  #doingLine .pill { display: inline-flex; align-items: center; gap: 8px;

    white-space: nowrap; overflow: hidden;
    background: var(--glass);
    -webkit-backdrop-filter: blur(20px) saturate(1.7);
    backdrop-filter: blur(20px) saturate(1.7);
    box-shadow: 0 2px 14px rgba(0,0,0,.07), inset 0 0 0 1px rgba(255,255,255,.5); }
  
  #doingLine .w { font-weight: 600; color: var(--accent); overflow: hidden;

  .toast {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px 13px 16px; border-radius: 20px;
    pointer-events: auto; cursor: pointer;
    transform: translateY(-140%); opacity: 0;
    transition: transform .42s cubic-bezier(.22,1.1,.36,1), opacity .28s ease;
  }
  .toast.in { transform: translateY(0); opacity: 1; }
  .toast .ti { flex: none; width: 22px; height: 22px; color: var(--dim); }
  .toast .ti svg { width: 100%; height: 100%; stroke-width: 1.8; }
  .toast .tx { flex: 1; min-width: 0; }
  .toast .t1 { font-size: 14.5px; font-weight: 700; line-height: 1.35; }
  .toast .t2 { font-size: 13px; color: var(--dim); line-height: 1.45; margin-top: 1px;

  .glass,
  .composer, #nkPop, .nk-say, .board-toggle, .menuCard, .crow, .songcard {
    
    background: var(--glass);
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--card) 76%, transparent),
      color-mix(in srgb, var(--card) 58%, transparent));
    -webkit-backdrop-filter: blur(24px) saturate(1.9) brightness(1.04);
    backdrop-filter: blur(24px) saturate(1.9) brightness(1.04);
    border: 0;
    box-shadow:
      0 10px 34px rgba(0,0,0,.09),              /* 外阴影：浮起来 */
      0 1px 3px rgba(0,0,0,.05),                /* 贴地那道近影 */
      inset 0 1px 0 rgba(255,255,255,.92),      /* 顶部内高光：上边缘那道光 */
      inset 0 -7px 18px rgba(255,255,255,.34),  /* 底部内反光：光打在下沿的回弹 */

        0 12px 38px rgba(0,0,0,.42),
        0 1px 3px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -7px 18px rgba(255,255,255,.045),
        inset 0 0 0 1px rgba(255,255,255,.09);

}

        0 12px 38px rgba(0,0,0,.42),
        0 1px 3px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -7px 18px rgba(255,255,255,.045),
        inset 0 0 0 1px rgba(255,255,255,.09);
    }

  /* ============ 顶栏（悬浮玻璃，消息从底下滑过去） ============ */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: 10px 18px 22px; padding-top: calc(10px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 8px;
    justify-content: space-between;

  }
  .title { display: none; }

  .claude-mark g { transform-origin: 36px 36px; animation: claudeBloom 5s ease-in-out infinite; }

  #welcome h2 {
    margin: 28px 0 0; color: var(--text); font-family: var(--serif);

    line-height: 1.12; text-align: center; text-wrap: balance;
  }
  /* 顶上那颗「看更早的」——老账都在，按一下捞 400 行 */
  #olderBtn {
    align-self: center; border: none; cursor: pointer;
    background: rgba(128,128,128,.12); color: inherit; opacity: .72;

  .row { width: 100%; max-width: 720px; margin: 0 auto; }
  .row.me { display: flex; justify-content: flex-end; }

  .cbk { margin: 10px 0; border-radius: 16px; overflow: hidden;
    background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .cbk-h { display: flex; align-items: center; gap: 2px;

  .cbk pre { margin: 0; padding: 13px 15px 15px; overflow-x: auto;

  /* 点右边那个展开：整段代码摊到全屏看，长命令不用左右拖 */

  .gu .caret {
    display: inline-block; width: 7px; height: 1.05em; vertical-align: -2px;

  @keyframes blink { 50% { opacity: 0; } }

  .toolline .ic { width: 15px; height: 15px; }
  .grabber {
    width: 38px; height: 5px; border-radius: 3px; background: var(--line);
    margin: 10px auto 0; flex: none;
  }
  .thinkbody {
    font-size: 15.5px; color: var(--text); line-height: 1.85;
    white-space: pre-wrap; word-break: break-word; padding: 6px 4px 14px;

  .toolline {

    max-width: 100%;
  }
  .toolline:active { opacity: .6; }
  
  .toolline .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0; flex: 1 1 auto; }

  .toolline .plus { color: var(--green); }
  .toolline .minus { color: var(--red); }
  .toolline .chev { flex: none; font-size: 13px; }
  .toolline .spin {
    flex: none; width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent-soft);
    animation: rot 1s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  .sys { font-size: 13px; color: var(--dim); text-align: center; }
  .err {

  }
  #pet:active { cursor: grabbing; }
  #pet img { width: 100%; height: 100%; display: block; pointer-events: none; }

    padding: 0 20px calc(14px + env(safe-area-inset-bottom));
    background: transparent; pointer-events: none;
  }
  /* padding-bottom 由 JS 跟着输入卡实际高度走，字永远不许被玻璃压住 */
  
  .composer {
    width: 100%; max-width: 560px; margin: 0 auto; pointer-events: auto;
    background: var(--card);
    border-radius: 27px;
    border: 1px solid color-mix(in srgb, var(--line) 76%, transparent);
    box-shadow: 0 10px 28px rgba(40, 38, 34, .08), 0 2px 5px rgba(40, 38, 34, .04);

    transition: border-radius .2s ease, box-shadow .2s ease;
  }
  .composer:not(.empty) { border-radius: 24px; }
  @media (prefers-color-scheme: dark) {
html:not([data-theme="light"]) #nkPop {
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);

    }

      background: var(--glass);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 2px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
    }
html:not([data-theme="light"]) .composer {
      background: var(--glass);
      border: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 2px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);

}
html[data-theme="dark"] .composer {

      border: 1px solid rgba(255, 255, 255, .12);

    }

  .ctlrow .gap { flex: 1; }
  #send {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    background: #191917; color: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: transform .16s ease, background .2s ease;
  }
  #send:active { transform: scale(.95); }
  #send .ic { width: 18px; height: 18px; }
  #send .arrow { display: none; }
  #send.hasText { background: var(--accent); }
  #send.hasText .voice { display: none; }
  #send.hasText .arrow { display: inline-flex; }
  #send:disabled { opacity: .35; }
  
  #send.stop { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  #send.stop .ic { display: none; }
  #send.stop::after {
    content: ''; width: 13px; height: 13px; border-radius: 3px; background: var(--text);
  }

  #lockWrap {
    position: fixed; inset: 0; z-index: 999; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 26px) 24px calc(env(safe-area-inset-bottom) + 15vh);
    transition: opacity .55s ease, transform .55s cubic-bezier(.4,0,.2,1);
    touch-action: none; user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }
  
  #lockWrap.gone { opacity: 0; transform: translateY(-26px) scale(1.03); pointer-events: none; }
  .lk-time { font-size: 46px; font-weight: 300; letter-spacing: -.01em; color: var(--text);
    line-height: 1.05; font-variant-numeric: tabular-nums; }
  .lk-date { font-size: 14px; color: var(--dim); margin-top: 5px; letter-spacing: .06em; }
  .lk-art { width: min(52vw, 202px); height: auto; margin: 5vh 0 0;
    animation: lkFloat 6s ease-in-out infinite; }
  @keyframes lkFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
  
  .lk-word { font-family: var(--serif); font-size: 25px; color: var(--text);
    letter-spacing: .005em; margin: 34px 24px 38px; font-weight: 700;
    line-height: 1.42; text-align: center; }

  /* 液态玻璃滑块：半透明 + 背后模糊 + 一道内高光，压在浅底上才有"玻璃"的实感 */
  .lk-track {
    position: relative; width: min(84vw, 320px); height: 62px; border-radius: 999px;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--line);
    overflow: hidden;
  }
  /* 一道慢慢扫过去的光，暗示"往右滑" */
  
  .lk-hint { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 14px; color: var(--dim); letter-spacing: .16em;
    padding-left: 46px; transition: opacity .2s; pointer-events: none; }
  
  .lk-knob {
    position: absolute; top: 5px; left: 5px; width: 52px; height: 52px; border-radius: 50%;
    background: var(--text);
    box-shadow: 0 3px 12px rgba(0,0,0,.22);
    display: flex; align-items: center; justify-content: center;
    transition: transform .32s cubic-bezier(.34,1.4,.5,1);
  }
  .lk-knob.dragging { transition: none; }
  .lk-knob::after {
    content: ''; width: 11px; height: 11px; border-right: 2.4px solid #fff;
    border-top: 2.4px solid #fff; transform: rotate(45deg) translate(-2px, 2px);
  }

  /* ============ 侧边栏 ============ */
  #drawerWrap { position: fixed; inset: 0; z-index: 40; display: none; }
  #drawerWrap.open { display: block; }
  #drawerWrap .shade { position: absolute; inset: 0; background: var(--overlay); opacity: 0; transition: opacity .22s; }
  #drawerWrap.show .shade { opacity: 1; }
  #drawer {
    position: absolute; top: 0; bottom: 0; left: 0; width: min(84vw, 330px);

    padding: calc(16px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-102%); transition: transform .24s ease;
    box-shadow: 4px 0 24px rgba(0,0,0,.12);
  }
  #drawerWrap.show #drawer { transform: none; }
  .brand {
    font-family: var(--serif); font-size: 30px; font-weight: 700;
    padding: 6px 24px 18px; letter-spacing: .01em;
  }
  .nav { flex: 1; overflow-y: auto; padding: 0 12px; }
  .nav .item {
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 12px 14px; border-radius: 12px; font-size: 16.5px; text-align: left;
  }
  .nav .item .ic { width: 21px; height: 21px; }
  .nav .item.on { background: var(--panel); }
  .nav .item.dis { color: var(--dim); }
  .nav .item.dis .tag {
    margin-left: auto; font-size: 11px; color: var(--dim);
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px;
  }
  
  .nav .sect { font-size: 13.5px; color: var(--dim); padding: 20px 14px 6px; }
  .nav .recent {
    display: block; width: 100%; text-align: left; padding: 10px 14px;
    font-size: 15.5px; border-radius: 10px;
  }
  .nav .recent:active { background: var(--panel); }
  .drawer-foot { flex: none; display: flex; align-items: center; padding: 10px 20px 0; }
  #avatarBtn {
    width: 44px; height: 44px; border-radius: 50%; background: var(--card);
    border: 1px solid var(--line); font-size: 16px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .freshtip { text-align: center; font-size: 13px; color: var(--dim); padding: 34px 30px; line-height: 1.8; }
  
  #gongSheet .sheet { height: 100dvh; max-height: 100dvh; border-radius: 0; }
  /* 换行，不然他的思维链会被挤成气泡旁边一条窄柱（8/3 截图当场看出来的） */
  
  #gongBody { display: flex; flex-direction: column; gap: 18px; }
  #gongBody .gu, #gongBody .bubble { font-size: 15.5px; line-height: 1.75; }
  #gongFoot {

  }
  #gongInput {
    flex: 1; border: 0; outline: 0; background: var(--panel); color: var(--text);
    font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 18px;
    resize: none; max-height: 120px;
  }
  #gongSend {
    width: 38px; height: 38px; border-radius: 50%; flex: none;

    display: flex; align-items: center; justify-content: center;
  }
  #gongSend .ic { width: 18px; height: 18px; }
  #gongSend:disabled { opacity: .4; }

  .filecard {
    display: inline-flex; align-items: center; gap: 9px; max-width: 100%;
    background: var(--panel); border: 1px solid var(--line); border-radius: 13px;
    padding: 10px 14px; margin: 6px 0; font-size: 14.5px; color: var(--text);

  }
  .filecard:active { background: var(--card); }
  .filecard .ic { width: 17px; height: 17px; color: var(--dim); flex: none; }
  .filecard span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ============ 弹层 ============ */
  .sheetWrap { position: fixed; inset: 0; z-index: 50; display: none; }
  .sheetWrap.open { display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 700px) { .sheetWrap.open { align-items: center; } }
  .sheetWrap .shade { position: absolute; inset: 0; background: var(--overlay); }
  .sheet {
    position: relative; width: 100%; max-width: 640px;
    max-height: 86vh; min-height: 300px;
    background: var(--bg); border-radius: 24px 24px 0 0;
    display: flex; flex-direction: column;
    animation: rise .22s ease;
  }
  @media (min-width: 700px) { .sheet { border-radius: 24px; max-height: 80vh; } }
  .sheet::after {   /* 往上拽的时候底下不露缝 */

  .sheet .head {

  .sheet .head .ht { flex: 1; text-align: center; font-size: 18px; font-weight: 700; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .head .hspace { width: 40px; flex: none; }
  .sheet .body { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 6px 20px calc(20px + env(safe-area-inset-bottom)); }

  .group-label { font-size: 14.5px; color: var(--dim); padding: 14px 4px 8px; }
  .group { background: var(--panel); border-radius: 18px; overflow: hidden; }

  .group .grow + .grow { border-top: 1px solid var(--line); }

  .group .grow:not(.static):active { background: rgba(0,0,0,.04); }
  .gnote { font-size: 13.5px; color: var(--dim); padding: 12px 6px 0; line-height: 1.6; }

  /* Usage */
  .ucard { background: var(--panel); border-radius: 18px; padding: 18px 20px; }
  .ucard + .ucard, .ucard + .group-label { margin-top: 6px; }
  .urow-top { display: flex; align-items: baseline; justify-content: space-between; }

  .urow-top .up { font-size: 15px; color: var(--dim); }
  .ubar {
    height: 8px; border-radius: 999px; background: var(--amber-track);
    margin: 12px 0 10px; overflow: hidden;
  }
  
  .ubar > i { display: block; height: 100%; border-radius: 999px; background: var(--amber); transition: width .4s, background .3s; }
  .ubar.warn { background: var(--amber-track); }
  .ubar.warn > i { background: var(--amber); }
  .ubar.hot { background: var(--red-track); }
  .ubar.hot > i { background: var(--red); }
  .ureset { font-size: 14px; color: var(--dim); }
  .usep { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

  /* 工具时间线 */
  .tl { padding: 8px 4px; }
  .tl .titem {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 9px 6px; font-size: 15.5px; text-align: left; border-radius: 10px;
  }
  .tl .titem:active { background: rgba(0,0,0,.04); }
  .tl .titem .ic { width: 19px; height: 19px; color: var(--text); }
  .tl .titem .tlbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .tl .titem .tlbl b { color: var(--text); font-weight: 500; }
  .tl .link { width: 2px; height: 14px; background: var(--line); margin-left: 14px; }

  .dwrap { padding: 4px 2px 10px; }
  .dpath { font-size: 13px; color: var(--dim); word-break: break-all; padding: 0 2px 10px; }
  pre.code {
    margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; font-size: 13px; line-height: 1.6; overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre; color: var(--text);
  }
  .diff { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); }
  .diff .dl {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; line-height: 1.65; padding: 1px 12px;
    white-space: pre-wrap; word-break: break-all;
  }
  .diff .dl.add { background: rgba(46, 125, 67, .12); color: var(--green); }
  .diff .dl.del { background: rgba(192, 57, 43, .10); color: var(--red); }

  /* 选模型 / Effort / More models */
  .mrow { display: block; width: 100%; text-align: left; padding: 15px 18px; }
  .mrow + .mrow { border-top: 1px solid var(--line); }
  .mrow .mn { font-size: 16.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .mrow .mn .ck { margin-left: auto; color: var(--accent); width: 18px; height: 18px; }
  .mrow .mn .badge {
    font-size: 11.5px; font-weight: 500; color: var(--dim);
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px;
  }
  .mrow .md { font-size: 13.5px; color: var(--dim); margin-top: 2px; font-weight: 400; }

  /* 全屏房间开着时，聊天的顶栏和输入卡先退场——毛玻璃层在个别浏览器里会钻上来 */
  body:has(.sheetWrap.open) header, body:has(.sheetWrap.open) footer { visibility: hidden; }
  /* Add to chat 的半屏状态保留截图里的背景窗口，只让遮罩压暗它。 */
  body:has(#addSheet.open) header, body:has(#addSheet.open) footer { visibility: visible; }
  body:has(#addSheet.expanded) header, body:has(#addSheet.expanded) footer { visibility: hidden; }
  #addSheet .shade { background: rgba(40, 38, 34, .34); }

  .nb-tabs {
    display: flex; gap: 4px; padding: 4px; margin-bottom: 12px;
    background: var(--panel); border-radius: 13px;
  }
  .nb-tab {
    flex: 1; padding: 8px 0; border-radius: 10px; font-size: 14.5px;
    background: transparent; color: var(--dim);
  }
  .nb-tab.on {
    background: var(--card); color: var(--text); font-weight: 600;
    box-shadow: 0 1px 3px rgba(0,0,0,.09);
  }
  .nb-note {
    position: relative; border-radius: 4px; padding: 15px 16px 12px;
    margin-bottom: 14px; box-shadow: 0 2px 7px rgba(0,0,0,.09);

  }
  .nb-note::before {   /* 顶上一条胶带，跟便签板一家人 */

    width: 44px; height: 13px; border-radius: 2px;
    background: rgba(243, 237, 221, .9); box-shadow: 0 1px 3px rgba(0,0,0,.12);
    transform: rotate(-1.5deg);
  }
  .nb-note .nbt { font-size: 15px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .nb-note .nbm { font-size: 11.5px; opacity: .55; margin-top: 8px; display: flex; align-items: center; }
  .nb-note .nbx { margin-left: auto; opacity: .6; font-size: 13px; }
  .nb-write { display: flex; flex-direction: column; gap: 8px; background: var(--panel); border-radius: 16px; padding: 12px 14px; margin-bottom: 16px; }
  .nb-write textarea {

  }
  .nb-write textarea::placeholder { color: var(--dim); }
  .nb-write .go { align-self: flex-end; background: var(--text); color: var(--bg); border-radius: 999px; padding: 7px 20px; font-size: 14px; }
  .nb-empty { text-align: center; color: var(--dim); font-size: 14px; padding: 34px 0; font-family: var(--serif); }

  /* 搜索 */
  .fd-bar { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 14px; padding: 11px 15px; }
  .fd-bar .ic { width: 17px; height: 17px; color: var(--dim); flex: none; }
  .fd-bar input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 15.5px; }
  .fd-hint { font-size: 13px; color: var(--dim); padding: 12px 4px; line-height: 1.8; }

  .fd-hit .fk { background: var(--panel); border-radius: 999px; padding: 1px 9px; }

  .cal-head { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 2px 0 14px; }
  .cal-head .cm { font-size: 18px; font-weight: 600; min-width: 145px; text-align: center; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .cal-head .cnav { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: .55; }
  .cal-head .cnav .ic { width: 14px; height: 14px; }
  .cal-head .ctoday {   
    position: absolute; right: 0; top: 4px;
    font-size: 12.5px; color: var(--dim); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px;
  }
  
  .cal-week {
    display: grid; grid-template-columns: repeat(7, 1fr);
    font-size: 10.5px; letter-spacing: .12em; color: var(--dim);
    text-align: center; padding-bottom: 10px;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; }
  .cal-day {
    position: relative; aspect-ratio: 1 / 1.15;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 15px; background: transparent;
  }
  .cal-day.other { opacity: .22; }
  .cal-day .dnum {
    width: 38px; height: 38px; border-radius: 50%;   
    display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;      /* 1 和 31 一样宽，列才齐 */
    transition: background .18s;
  }
  
  .cal-day.sel .dnum { background: color-mix(in srgb, var(--dim) 30%, transparent); }
  
  .cal-day.today .dnum { background: var(--accent); color: #fff; }  /* 今天=这一屏唯一的一粒橘 */
  .cal-day .dnum, .cal-day .dots { position: relative; z-index: 1; }
  .cal-day .dots { display: flex; gap: 3px; height: 4px; margin-top: 3px; }
  .cal-day .dots i { width: 4px; height: 4px; border-radius: 50%; }
  .cal-day .dots .dr { background: var(--dim); }
  .cal-day .dots .ds { background: var(--text); }
  /* 详情区：日期是节标，每件事是一根圆角玻璃条 */
  .cal-detail { margin-top: 20px; }
  .cal-dt { font-size: 12px; color: var(--dim); letter-spacing: .12em;
    padding: 0 4px 10px; font-variant-numeric: tabular-nums; }
  .cal-ev { display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    font-size: 15px; margin-bottom: 9px; border-radius: 15px;
    background: var(--panel); }
  .cal-ev .et { flex: 1; min-width: 0; }
  .cal-ev .em { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .cal-ev .star { color: var(--pink); width: 16px; height: 16px; }
  .cal-ev .edel { color: var(--dim); width: 17px; height: 17px; opacity: .5; }
  .cal-plus { display: flex; align-items: center; gap: 8px; padding: 12px 15px;

  .cal-plus .ic { width: 14px; height: 14px; }
  .cal-add { display: none; border-radius: 15px; padding: 14px 15px 12px; margin-bottom: 9px;
    background: var(--panel); }
  .cal-add.open { display: block; }
  .cal-add input[type=text] {
    width: 100%; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 15.5px; padding: 2px 0 10px;
  }
  .cal-add .row2 { display: flex; align-items: center; gap: 8px; font-size: 12.5px;
    color: var(--dim); flex-wrap: wrap; }
  .cal-add input[type=time] {
    border: 0; border-radius: 999px; padding: 6px 12px;
    background: var(--panel); color: var(--text); font: inherit; font-size: 12.5px;
    font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none;
  }
  .cal-add .go { margin-left: auto; background: var(--text); color: var(--bg);
    border: 0; border-radius: 999px; padding: 8px 20px; font-size: 13px; font-weight: 500; }
  .pcard { margin-top: 14px; border-radius: 15px; padding: 14px 15px 10px;
    background: var(--panel); }
    .pcard .pt { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; padding-bottom: 6px; }
  .pcard .pt .ic { width: 14px; height: 14px; color: var(--pink); }
  /* 一行一件事，左边名目右边内容——跟小票的表头一个排法 */
  .prow { display: flex; align-items: center; padding: 11px 0; font-size: 14.5px; }
  .prow + .prow { border-top: 1px solid var(--line); }
  .prow .pk { color: var(--dim); font-size: 13.5px; letter-spacing: .08em; }
  .prow .pv { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  /* 强度：亮几个就是几分，粉的 */
  .pv .lv { width: 19px; height: 19px; color: var(--pink); opacity: .25; }
  .pv .lv.on { opacity: 1; }
  .pv .lv svg { fill: currentColor; stroke: none; }
  .pv .gap { gap: 11px; display: flex; align-items: center; }
  /* 心情：一排小脸，选中的粉起来 */
  .pv .face { width: 25px; height: 25px; color: var(--dim); opacity: .45; }
  .pv .face.on { color: var(--pink); opacity: 1; }
  .pv .face svg { stroke-width: 1.7; }
  /* 来没来：iOS 那种开关 */

  .note { --tape: rgba(240, 232, 212, .9); }
  .note::before {
    content: ""; position: absolute; border-radius: 2px;
    background: var(--tape); box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .note.t-h::before {   /* 横贴顶中 */
    top: -7px; left: 50%; margin-left: -24px; width: 48px; height: 15px;
    transform: rotate(var(--ta, -2deg));
  }
  .note.t-l::before {   /* 歪贴左上角 */
    top: -8px; left: -12px; width: 44px; height: 14px; transform: rotate(-38deg);
  }
  .note.t-r::before {   /* 歪贴右上角 */
    top: -8px; right: -12px; width: 44px; height: 14px; transform: rotate(38deg);
  }
  .note.t-v::before {   
    top: -12px; left: 50%; margin-left: -7px; width: 14px; height: 30px;
    transform: rotate(var(--ta, 2deg));
  }
  .note.t-2::before {   /* 对角两条 */
    top: -8px; right: -12px; width: 44px; height: 14px; transform: rotate(38deg);
  }
  .note.t-2::after {
    content: ""; position: absolute; bottom: -7px; left: -13px;
    width: 44px; height: 14px; border-radius: 2px;
    background: var(--tape); box-shadow: 0 1px 3px rgba(0,0,0,.12);
    transform: rotate(38deg);

/* 提示条（2026-08-07）。用法：toast('他有反应了', '刚才那一下，他记住了')
   第三个参数是图标名（家里 ICONS 里的），不给就用一个默认的。
   自动收走，也可以点掉。同时最多挂三条，多了顶掉最老的—— */
let toastLane = null;
function toast(title, body, icon, sticky) {
  if (!toastLane) {
    toastLane = document.createElement('div');
    toastLane.id = 'toastLane';
    document.body.appendChild(toastLane);
  }
  const el = document.createElement('div');
  el.className = 'toast glass';
  const ic = document.createElement('span');
  ic.className = 'ti';
  ic.innerHTML = ICONS[icon] || ICONS.bell || '';
  const tx = document.createElement('div');
  tx.className = 'tx';
  const t1 = document.createElement('div');
  t1.className = 't1'; t1.textContent = title;
  tx.appendChild(t1);
  const t2 = document.createElement('div');
  t2.className = 't2'; t2.textContent = body || '';
  if (!body) t2.style.display = 'none';
  tx.appendChild(t2);
  el._t2 = t2;
  const x = document.createElement('span');
  x.className = 'tx-close'; x.innerHTML = ICONS.x || '';
  el.append(ic, tx, x);
  toastLane.appendChild(el);
  while (toastLane.children.length > 3) toastLane.firstChild.remove();
  requestAnimationFrame(() => el.classList.add('in'));
  const away = () => {
    el.classList.remove('in');
    setTimeout(() => el.remove(), 460);
  };
  el._away = away;
  /* sticky：搬大文件那种要一直改进度的，不能 4 秒就自己走 */
  if (sticky) {
    el.onclick = away;
  } else {
    const t = setTimeout(away, 4200);
    el.onclick = () => { clearTimeout(t); away(); };
  }
  return el;
}

function toastSplit(text) {
  const t = String(text == null ? '' : text)
    .replace(/^[（(]/, '').replace(/[）)]$/, '').trim();
  const i = t.indexOf('，');
  return i > 0 ? [t.slice(0, i), t.slice(i + 1)] : [t, ''];
}

/* 说话里夹的料——图（表情包、照片链接）变成真的图，行首 # 变成大字 */
const IMG_RE = /!\[[^\]]*\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s"'<>]+?\.(?:png|jpe?g|gif|webp)(?:\?[^\s"'<>]*)?)/gi;
const H_RE = /^(#{1,3})\s+(.*)$/;
/* 行内的重音：**粗** `码` ~~划掉~~。全用 createElement 拼，不碰 innerHTML */
const INLINE_RE = /\*\*([^\n]+?)\*\*|`([^`\n]+?)`|~~([^\n]+?)~~/g;
function appendInline(el, text, streaming) {
  let tail = null;
  if (streaming) {
    const marks = [['**', 'strong'], ['`', 'code'], ['~~', 's']];
    for (const [mk, tag] of marks) {
      const n = text.split(mk).length - 1;
      if (n % 2) {
        const i = text.lastIndexOf(mk);
        tail = { text: text.slice(i + mk.length), tag };
        text = text.slice(0, i);
        break;
      }
    }
    const cutLone = (s) => (s.endsWith('*') && !s.endsWith('**') ? s.slice(0, -1) : s);
    if (tail) tail.text = cutLone(tail.text);
    else text = cutLone(text);
  }
  INLINE_RE.lastIndex = 0;
  let last = 0, m;
  while ((m = INLINE_RE.exec(text))) {
    if (m.index > last) el.append(text.slice(last, m.index));
    let node;
    if (m[1] !== undefined) { node = document.createElement('strong'); node.textContent = m[1]; }
    else if (m[2] !== undefined) { node = document.createElement('code'); node.className = 'mdcode'; node.textContent = m[2]; }
    else { node = document.createElement('s'); node.textContent = m[3]; }
    el.appendChild(node);
    last = m.index + m[0].length;
  }
  if (last < text.length) el.append(text.slice(last));
  if (tail && tail.text) {
    const node = document.createElement(tail.tag);
    if (tail.tag === 'code') node.className = 'mdcode';
    node.textContent = tail.text;
    el.appendChild(node);
  }
}

const ORPHAN_TAIL = /(?:\n\n\S)+$/;

function trimOrphanTail(el) {
  const raw = el._raw != null ? el._raw : el.textContent;
  el._final = true;               // 这一轮完了，这条消息定稿，谁都别再画它
  const m = raw && raw.match(ORPHAN_TAIL);
  if (!m) return;
  el._raw = raw.slice(0, raw.length - m[0].length);
  el.textContent = el._raw;
  el.removeAttribute('data-rich');
  renderRich(el);
}

const STREAM_FILE_TAIL = /(?:https?:\/\/[^\s"'<>]*)?\/?a(?:p(?:i(?:\/(?:f(?:i(?:l(?:e(?:\?(?:n(?:a(?:m(?:e(?:=[^\s"'<>]*)?)?)?)?)?)?)?)?)?)?)?)?)?$/;

/* 说到一半的歌链接：这条比文件那条更要紧。
   `…song?id=1146` 写到这儿，正则里的 \d+ 已经能匹配了——它会当场
   渲染出一张**指错歌**的卡片，然后跳成另一首。所以流式的时候
   结尾那个还没写完的链接一律藏住，定稿再变卡片。 */
const STREAM_SONG_TAIL = /https?:\/\/(?:[a-z0-9.]*music[a-z0-9.]*|[a-z]{1,6})(?:\/[^\s]*)?$/i;

/* 流式重绘：攒着原文，每帧重画一次（rAF 合并，别一个 token 排一次版） */
function paintStream(el) {
  if (el._final || el._painting) return;
  el._painting = true;
  requestAnimationFrame(() => {
    el._painting = false;
    // 定稿的那份是权威。刷新网页时几百条事件在一个循环里跑完，rAF 排在最后面才轮到——
    // 不拦这一下，它会把已经画好的卡片、加粗、摘干净的孤尾全冲回流式那版。
    if (el._final || !el.isConnected) return;
    el.textContent = '';
    // 流式时也压着孤尾：真有下文的话，下一帧就补齐了，只差一帧；
    const t = (el._raw || '').replace(ORPHAN_TAIL, '')
      .replace(STREAM_FILE_TAIL, '').replace(STREAM_SONG_TAIL, '');
    appendWithImages(el, t, true);
    const c = document.createElement('span');
    c.className = 'caret';
    el.appendChild(c);
  });
}

const SONG_RE = /https?:\/\/music\.163\.com\/(?:#\/)?song\?id=(\d+)/g;

const FILE_RE = /(?:https?:\/\/[^\s"'<>]*)?\/?api\/file\?name=([^\s"'<>&`*，。！？；：、（）【】「」『』]+)/g;
// 英文标点贴在名字屁股上时摘掉；句点不摘，那是扩展名
const NAME_TAIL = /[,!?;:)\]}]+$/;

function fileName(raw) {
  const name = String(raw || '').replace(NAME_TAIL, '');
  let show = name;
  try { show = decodeURIComponent(name); } catch (e) {}
  return { name, show };
}

function appendFileCard(el, raw) {
  const { name, show } = fileName(raw);
  const a = document.createElement('a');
  a.className = 'filecard';
  a.href = 'api/file?name=' + encodeURIComponent(show);
  a.download = show;
  a.appendChild(icEl('filePlus', 17));
  const s = document.createElement('span');
  s.textContent = show;
  a.appendChild(s);
  // 改成自己把文件抓回来做成 blob 再存——页面一动不动，聊天还在原地
  a.addEventListener('click', async (e) => {
    e.preventDefault();
    if (a._busy) return;
    a._busy = true;
    const old = s.textContent;
    s.textContent = old + ' · 拿着…';
    try {
      const r = await fetch(a.href, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status === 404 ? '柜子里没这个文件' : '拿不到（' + r.status + '）');
      const url = URL.createObjectURL(await r.blob());
      const t = document.createElement('a');
      t.href = url; t.download = show;
      document.body.appendChild(t); t.click(); t.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      s.textContent = old;
    } catch (err) {
      s.textContent = old + ' · ' + (err.message || '出岔子了');
      setTimeout(() => { s.textContent = old; }, 4000);
    }
    a._busy = false;
  });
  el.appendChild(a);
}

function appendWithImages(el, text, streaming) {
  SONG_RE.lastIndex = 0;
  if (SONG_RE.test(text)) {
    const re = new RegExp(SONG_RE.source, 'g');
    let cur = 0, sm;
    while ((sm = re.exec(text))) {
      if (sm.index > cur) appendWithImages(el, text.slice(cur, sm.index), streaming);
      appendSongCard(el, sm[1]);
      cur = sm.index + sm[0].length;
    }
    if (cur < text.length) appendWithImages(el, text.slice(cur), streaming);
    return;
  }
  // 再把文件链接摘出来做成卡片，剩下的照旧走图片和行内标记
  FILE_RE.lastIndex = 0;
  if (FILE_RE.test(text)) {
    // 自己的正则实例：下面要递归，共用全局 lastIndex 会被里层重置成 0，外层就永远绕不出去
    const re = new RegExp(FILE_RE.source, 'g');
    let cur = 0, fm;
    while ((fm = re.exec(text))) {
      if (fm.index > cur) appendWithImages(el, text.slice(cur, fm.index), streaming);
      appendFileCard(el, fm[1]);
      const eaten = fm[1].length - fm[1].replace(NAME_TAIL, '').length;
      cur = fm.index + fm[0].length - eaten;
    }
    if (cur < text.length) appendWithImages(el, text.slice(cur), streaming);
    return;
  }
  IMG_RE.lastIndex = 0;
  let last = 0, m;
  while ((m = IMG_RE.exec(text))) {
    if (m.index > last) appendInline(el, text.slice(last, m.index), streaming);
    const img = document.createElement('img');
    img.src = m[1] || m[2];
    img.className = 'chatimg';
    img.loading = 'lazy';
    img.onload = () => scroll();
    el.appendChild(img);
    last = m.index + m[0].length;
  }
  if (last < text.length) appendInline(el, text.slice(last), streaming);
}
const FENCE_RE = /```([^\n`]*)\n([\s\S]*?)```/g;

function appendCodeBlock(el, lang, code) {
  el.appendChild(buildCodeBlock(lang, code));
}

function buildCodeBlock(lang, code, isFull) {
  const box = document.createElement('div');
  box.className = isFull ? 'cbk cbk-full' : 'cbk';
  const head = document.createElement('div');
  head.className = 'cbk-h';
  const nm = document.createElement('span');
  nm.className = 'lang';
  nm.textContent = (lang || '').trim() || 'Code';

  const cp = document.createElement('button');
  cp.innerHTML = ICONS.copy;
  cp.title = '复制';
  cp.onclick = () => {
    const ok = () => {
      cp.innerHTML = ICONS.check; cp.classList.add('done');
      setTimeout(() => { cp.innerHTML = ICONS.copy; cp.classList.remove('done'); }, 1600);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(ok).catch(() => {});
    else {
      const t = document.createElement('textarea');
      t.value = code; t.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); ok(); } catch (e) {}
      document.body.removeChild(t);
    }
  };

  const ex = document.createElement('button');
  ex.innerHTML = isFull ? ICONS.x : ICONS.expand;
  ex.title = isFull ? '收起' : '展开';
  ex.onclick = () => {
    if (isFull) { box.remove(); return; }
    const full = buildCodeBlock(lang, code, true);
    document.body.appendChild(full);
  };

  head.append(nm, cp, ex);
  const pre = document.createElement('pre');
  const cd = document.createElement('code');
  cd.textContent = code.replace(/\n$/, '');
  pre.appendChild(cd);
  box.append(head, pre);
  return box;
}

function renderRich(el) {
  if (!el || el.dataset.rich) return;
  // 流式那条路把标记边走边吃掉了，textContent 里已经没有原文——认 _raw
  const text = el._raw != null ? el._raw : el.textContent;
  FENCE_RE.lastIndex = 0;
  if (FENCE_RE.test(text)) {
    /* 有代码块：切成「文本 / 代码块 / 文本 …」，文本那几段还走原来那条路 */
    el.textContent = '';
    FENCE_RE.lastIndex = 0;
    let last = 0, m;
    while ((m = FENCE_RE.exec(text))) {
      if (m.index > last) renderPlainInto(el, text.slice(last, m.index));
      appendCodeBlock(el, m[1], m[2]);
      last = m.index + m[0].length;
    }
    if (last < text.length) renderPlainInto(el, text.slice(last));
    if (!el.innerHTML && text) el.textContent = text;   // 同一条兜底：宁可少一次排版
    el.dataset.rich = '1';
    return;
  }
  renderPlainInto(el, text, true);
  el.dataset.rich = '1';
}

/* 原来 renderRich 的身子拆出来单用——代码块之间的那些文本还要走它。
   有一处坑：这个身子第一句是 `el.textContent = ''`（原来它独占整个气泡，
   清空是对的）。拆出来之后一条消息里会调它好几次，第二次一清空
   就把前面already渲染好的代码块连同文本一起抹了——实测出来的现象是
   气泡里只剩最后一段。所以非独占的时候让它渲染到一个临时 span 里，
   渲染完再挂上去，函数体一个字都不用改。 */
function renderPlainInto(host, text, whole) {
  const el = whole ? host : document.createElement('span');
  IMG_RE.lastIndex = 0;
  const hasImg = IMG_RE.test(text);
  const hasH = /^#{1,3}\s+/m.test(text);
  INLINE_RE.lastIndex = 0;
  const hasInline = INLINE_RE.test(text);
  FILE_RE.lastIndex = 0;
  const hasFile = FILE_RE.test(text);
  SONG_RE.lastIndex = 0;
  const hasSong = SONG_RE.test(text);
  if (!hasImg && !hasH && !hasInline && !hasFile && !hasSong) {
    if (!whole) { el.append(text); host.appendChild(el); }
    return;
  }
  el.textContent = '';
  const lines = text.split('\n');
  lines.forEach((line, i) => {
    const hm = line.match(H_RE);
    if (hm) {
      const d = document.createElement('div');
      d.className = 'mdh mdh' + hm[1].length;
      appendWithImages(d, hm[2]);
      el.appendChild(d);
    } else {
      appendWithImages(el, line);
      const next = lines[i + 1];
      if (next !== undefined && !H_RE.test(next)) el.append('\n');
    }
  });
  if (whole && !el.innerHTML && text) el.textContent = text;
  if (!whole) host.appendChild(el);
}
function renderAllRich() {
  document.querySelectorAll('.gu:not([data-rich]), .bubble:not([data-rich])').forEach(el => renderRich(el));
  healEmptyGu();
}
/* 全场自检：谁空了就把原文还回去。念完历史、翻完老账各走一遍 */
function healEmptyGu() {
  document.querySelectorAll('#log .gu, #log .bubble').forEach(el => {
    if (!el.innerHTML && el._raw) el.textContent = el._raw;
  });
}

/* ---------- 工具小动作 ---------- */
const toolInfo = {};
let curGroup = null;

function basename(p) { return String(p || '').split('/').pop(); }

function verbOf(name, input) {
  input = input || {};
  switch (name) {
    case 'Bash':   return ['terminal', 'Ran', input.description || (input.command || '').slice(0, 60)];
    case 'Write':  return ['fileText', 'Created', basename(input.file_path)];
    case 'Edit':   return ['fileText', 'Updated', basename(input.file_path)];
    case 'Read':   return ['bookOpen', 'Read', basename(input.file_path)];
    case 'Glob': case 'Grep': return ['search', 'Searched', input.pattern || ''];
    case 'WebSearch': return ['globe', 'Searched web', input.query || ''];
    case 'WebFetch':  return ['globe', 'Fetched', input.url || ''];
    case 'Skill':  return ['book', 'Opened', input.skill || ''];
    case 'Task': case 'Agent': return ['box', 'Delegated', input.description || ''];
  }
  if (name.startsWith('mcp__')) {
    const parts = name.split('__');
    return ['zap', 'Used', (parts[1] || '') + ' · ' + (parts[2] || '')];
  }
  return ['tool', 'Used', name];
}

function diffCount(name, input) {
  input = input || {};
  if (name === 'Write') return [String(input.content || '').split('\n').length, 0];
  if (name === 'Edit') {
    const o = String(input.old_string || '').split('\n').length;
    const n = String(input.new_string || '').split('\n').length;
    return [n, o];
  }
  return null;
}

function groupLabel(ids) {
  if (!ids.length) return '';
  if (ids.length === 1) {
    const t = toolInfo[ids[0]];
    const [, verb, what] = verbOf(t.name, t.input);
    return { verb, what, dc: diffCount(t.name, t.input) };
  }
  const nCmd = ids.filter(id => toolInfo[id].name === 'Bash').length;
  const nFile = ids.filter(id => ['Write', 'Edit'].includes(toolInfo[id].name)).length;
  if (nCmd === ids.length) return { verb: 'Ran', what: nCmd + ' commands', dc: null };
  if (nFile && nCmd) return { verb: 'Created a file,', what: 'ran a command', dc: null };
  return { verb: 'Did', what: ids.length + ' things', dc: null };
}

function renderGroupLine() {
  if (!curGroup) return;
  const { verb, what, dc } = groupLabel(curGroup.ids);
  let html = '<b>' + verb + '</b> ' + escapeHtml(what || '');
  if (dc) html += ' <span class="plus">+' + dc[0] + '</span> <span class="minus">-' + dc[1] + '</span>';
  curGroup.labelEl.innerHTML = html;
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function addToolUse(part) {
  petSet('typing');
  closeThink();
  toolInfo[part.id] = { name: part.name, input: part.input || {}, result: null, isError: false, done: false };
  if (!curGroup) {
    const r = row();
    const line = document.createElement('button');
    line.className = 'toolline';
    line.innerHTML = '<span class="spin"></span><span class="lbl"></span><span class="chev">›</span>';
    r.appendChild(line);
    curGroup = { ids: [], lineEl: line, labelEl: line.querySelector('.lbl'), spinEl: line.querySelector('.spin') };
    const g = curGroup;
    line.onclick = () => openToolSheet(g.ids);
  }
  curGroup.ids.push(part.id);
  doingOnTool(toolInfo[part.id]);      // 那行字跟着我手上的活走
  renderGroupLine();
  guEl = null;
  scroll();
}
function markToolDone(id, isError, content) {
  const t = toolInfo[id];
  if (!t) return;
  t.done = true; t.isError = !!isError;
  t.result = flattenResult(content);
  if (curGroup && curGroup.ids.includes(id) && curGroup.ids.every(i => toolInfo[i].done)) {
    curGroup.spinEl.style.display = 'none';
    doingToolDone();                   // 手上活干完了，那行字退回随机词
  }
}
function closeGroup() {
  if (curGroup) { curGroup.spinEl.style.display = 'none'; curGroup = null; }
}
function flattenResult(content) {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    return content.map(c => (c && c.type === 'text') ? c.text : '').join('\n').trim();
  }
  return '';
}

const toolSheet = document.getElementById('toolSheet');
const toolTitle = document.getElementById('toolTitle');
const toolBody = document.getElementById('toolBody');
const toolBack = document.getElementById('toolBack');
let sheetStack = [];

function openToolSheet(ids) {
  sheetStack = [{ view: 'list', ids }];
  renderToolSheet();
  toolSheet.classList.add('open');
}
function renderToolSheet() {
  const top = sheetStack[sheetStack.length - 1];
  toolBack.innerHTML = '';
  toolBack.appendChild(icEl(sheetStack.length > 1 ? 'chevL' : 'x', 16));
  if (top.view === 'list') {
    const { verb, what } = groupLabel(top.ids);
    toolTitle.textContent = (verb + ' ' + (what || '')).trim();
    toolBody.innerHTML = '';
    const tl = document.createElement('div');
    tl.className = 'tl';
    top.ids.forEach((id, i) => {
      if (i) { const l = document.createElement('div'); l.className = 'link'; tl.appendChild(l); }
      const t = toolInfo[id];
      const [icon, verb, what] = verbOf(t.name, t.input);
      const b = document.createElement('button');
      b.className = 'titem';
      b.appendChild(icEl(icon, 19));
      const lbl = document.createElement('span');
      lbl.className = 'tlbl';
      lbl.innerHTML = '<b>' + escapeHtml(verb) + '</b> ' + escapeHtml(what || '');
      b.appendChild(lbl);
      const ch = document.createElement('span');
      ch.className = 'chev'; ch.textContent = '›';
      b.appendChild(ch);
      b.onclick = () => { sheetStack.push({ view: 'detail', id }); renderToolSheet(); };
      tl.appendChild(b);
    });
    toolBody.appendChild(tl);
  } else {
    const t = toolInfo[top.id];
    const [, verb, what] = verbOf(t.name, t.input);
    toolTitle.textContent = (verb + ' ' + (what || '')).trim();
    toolBody.innerHTML = '';
    const w = document.createElement('div');
    w.className = 'dwrap';
    const inp = t.input || {};
    if (t.name === 'Edit') {
      w.appendChild(pathLine(inp.file_path));
      w.appendChild(diffView(inp.old_string, inp.new_string));
    } else if (t.name === 'Write') {
      w.appendChild(pathLine(inp.file_path));
      w.appendChild(diffView('', inp.content));
    } else if (t.name === 'Bash') {
      w.appendChild(codeBlock('$ ' + (inp.command || '')));
      if (t.result) { w.appendChild(gapEl()); w.appendChild(codeBlock(clip(t.result, 6000))); }
    } else {
      w.appendChild(codeBlock(clip(JSON.stringify(inp, null, 2), 3000)));
      if (t.result) { w.appendChild(gapEl()); w.appendChild(codeBlock(clip(t.result, 6000))); }
    }
    if (t.isError) {
      const e = document.createElement('div');
      e.className = 'err'; e.style.marginTop = '10px';
      e.textContent = '这一下砸了';
      w.appendChild(e);
    }
    toolBody.appendChild(w);
  }
}
function pathLine(p) { const d = document.createElement('div'); d.className = 'dpath'; d.textContent = p || ''; return d; }
function gapEl() { const d = document.createElement('div'); d.style.height = '10px'; return d; }
function codeBlock(text) { const pre = document.createElement('pre'); pre.className = 'code'; pre.textContent = text || ''; return pre; }
function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '\n…（截断了）' : s; }
function diffView(oldS, newS) {
  const d = document.createElement('div');
  d.className = 'diff';
  if (oldS !== '') {
    String(oldS || '').split('\n').forEach(l => {
      const e = document.createElement('div'); e.className = 'dl del'; e.textContent = '- ' + l; d.appendChild(e);
    });
  }
  String(newS || '').split('\n').forEach(l => {
    const e = document.createElement('div'); e.className = 'dl add'; e.textContent = '+ ' + l; d.appendChild(e);
  });
  return d;
}
toolBack.onclick = () => {
  sheetStack.pop();
  if (sheetStack.length) renderToolSheet();
  else toolSheet.classList.remove('open');
};

function renderSaid(msgs) {
  for (const m of msgs) {
    if (m.kind === 'me') { endThink(); addMe(m.text); }
    else if (m.kind === 'gu') {
      endThink();                    // 该说正文了，思考那段收工
      const el = ensureGu();
      el._raw = m.text;
      el._final = true;              // 这是说完了的，谁都别再画它
      el.textContent = m.text;
      trimOrphanTail(el);            // 库里的半截消息拖着「课」这种孤尾——历史这条路也要摘
      renderRich(el);
      guEl = null;                   // 每条各归各位，别粘成一坨
    } else if (m.kind === 'think') {
      // 一轮思考在库里是好几条记录（想一段、歇一下、再想）。以前这里每条
      // appendThink 完立刻 endThink——各自建抽屉又各自关，最后一个都不剩。
      // 家里的我 8/3 自查出来的（docs/思维链重放.md）：多段并进同一个抽屉，
      if (turnThink && turnThink.text) appendThink('\n\n');
      appendThink(m.text);
    } else if (m.kind === 'tool') {
      let input = {};
      try { input = JSON.parse(m.extra || '{}'); } catch (e) {}
      const tid = 'past-' + m.seq + '-' + (m.at || 0) + '-' + Math.random().toString(36).slice(2, 7);
      addToolUse({ name: m.text, input, id: tid });
      markToolDone(tid, false, '');   // 过去的活早干完了，别让它在那儿转圈
    }
  }
  closeGroup(); endThink();
}

async function loadSaid() {
  try {
    const r = await fetch('api/messages?limit=400', { cache: 'no-store' });
    if (!r.ok) return 0;
    const d = await r.json();
    const msgs = d.msgs || [];
    renderSaid(msgs);
    healEmptyGu();
    if (msgs.length) earliestSeq = msgs[0].seq;
    ensureOlderBtn(!!d.more);
    scroll(true);
    return d.upto || 0;
  } catch (e) { return 0; }
}

let earliestSeq = null;      // 已经摆出来的最早一条 seq
let loadingOlder = false;
let olderBtn = null;

function ensureOlderBtn(more) {
  if (!olderBtn || !olderBtn.isConnected) {   // 清屏会把它一起扫掉，回来要重生
    olderBtn = document.createElement('button');
    olderBtn.id = 'olderBtn';
    olderBtn.textContent = '↑ 看更早的';
    olderBtn.onclick = loadOlder;
    log.prepend(olderBtn);
  }
  olderBtn.style.display = more ? '' : 'none';
}

async function loadOlder() {
  if (loadingOlder || earliestSeq === null) return;
  loadingOlder = true;
  olderBtn.textContent = '正在翻老账…';
  try {
    const r = await fetch('api/messages?limit=400&before=' + earliestSeq, { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    const msgs = d.msgs || [];
    if (msgs.length) {
      // 现有的画笔全往队尾画。所以：把正在流式的那支笔先收起来，
      // 记住队尾在哪，照常画完，再把新画的整段搬到最前头
      const stash = [guEl, turnThink, curGroup];
      guEl = null; turnThink = null; curGroup = null;
      const mark = log.children.length;
      const oldH = log.scrollHeight, oldTop = log.scrollTop;
      renderSaid(msgs);
      const fresh = Array.from(log.children).slice(mark);
      const anchor = olderBtn.nextSibling;
      for (const el of fresh) log.insertBefore(el, anchor);
      [guEl, turnThink, curGroup] = stash;
      healEmptyGu();
      log.scrollTop = oldTop + (log.scrollHeight - oldH);   // 眼睛停在原来那句上
      earliestSeq = msgs[0].seq;
    }
    ensureOlderBtn(!!d.more);
  } catch (e) {
  } finally {
    loadingOlder = false;
    if (olderBtn) olderBtn.textContent = '↑ 看更早的';
  }
}

/* ---------- 事件流 ---------- */
let cursor = 0, polling = false;
let armedFresh = false;        // 「新窗口」上膛了没——handle() 要用，所以在这儿先立着
let uiVer = null;              // 网页那份文件的版本，换了就自己重载
let pendingVer = null;

function tryReload() {
  if (!pendingVer) return false;
  try {
    if ((box.value || '').trim()) return false;
    const cur = Object.keys(sheets).find(k => sheets[k] && sheets[k].classList.contains('open'));
    // 开着某一页的时候照换——换完还回到同一页。只有在聊天页往上翻老账时才挂起，
    if (!cur && !atBottom()) return false;
    sessionStorage.setItem('reopenSheet', cur || '');
    sessionStorage.setItem('skipLock', '1');
  } catch (e) {}
  location.reload();
  return true;
}
async function poll() {
  if (polling) return;
  polling = true;
  try {
    const r = await fetch('api/poll?since=' + cursor, { cache: 'no-store' });
    if (r.status === 401) { location.href = './'; return; }
    const d = await r.json();
    if (d.ver) {
      if (uiVer === null) uiVer = d.ver;
      else if (d.ver !== uiVer) { pendingVer = d.ver; if (tryReload()) return; }
    }
    cursor = d.next;
    for (const ev of d.events) handle(ev);
    if (pendingVer && tryReload()) return;
  } catch {
    await new Promise(r => setTimeout(r, 1500));
  } finally {
    polling = false;
    poll();
  }
}
// 先把说完的话照着念一遍，游标落在最后一条上；之后的（正在说的那轮）才走事件流
loadSaid().then((upto) => { if (upto) cursor = upto; poll(); });

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - lastEventAt < 30000) return;
  try {
    const upto = await loadSaid();
    if (upto) cursor = upto;
    lastEventAt = Date.now();
  } catch (e) {}
});

function calDayWatch() {
  if (calDay && calDay !== todayStr() && sheets.cal && sheets.cal.classList.contains('open')) {
    loadCal();
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') calDayWatch();
});
setInterval(calDayWatch, 120000);

function handle(d) {
  lastEventAt = Date.now();
  if (d.type === 'echo') { if (armedFresh) setArmed(false); addMe(d.text); petSet('thinking'); return; }
  if (d.type === 'system' && d.subtype === 'newchat') { setArmed(false); log.innerHTML = ''; guEl = null; earliestSeq = null; olderBtn = null; note(d.text); return; }
  if (d.type === 'system' && d.subtype === 'switched') { setArmed(false); log.innerHTML = ''; guEl = null; earliestSeq = null; olderBtn = null; note(d.text); return; }

  if (d.type === 'stream_event') {
    const ev = d.event || {};
    const delta = ev.delta || {};
    if (delta.type === 'thinking_delta' && delta.thinking) {
      petSet('thinking');
      appendThink(delta.thinking);
      scroll();
      return;
    }
    if (delta.type === 'text_delta' && delta.text) {
      petSet('typing');
      const el = ensureGu();
      // 上一条已经定稿，现在又开口了——中间没干活，两条话共用这一个泡。
      // 把已经说完的那截钉成"基线"，等下这条的定稿只能接在它后面，不许把它吃掉。
      if (el._final) { el._base = el._raw || ''; el._final = false; }
      el._raw = (el._raw || '') + delta.text;
      paintStream(el);
      scroll();
      return;
    }
    return;
  }

  if (d.type === 'assistant') {
    const msg = d.message || {};
    const parts = msg.content || [];
    let firstText = true;
    for (const p of parts) {
      if (p.type === 'thinking' && p.thinking) {
        const buf = ensureThink();
        if (!buf.text) appendThink(p.thinking);
        closeThink();
      } else if (p.type === 'text' && p.text) {
        const el = ensureGu();
        el.querySelector('.caret')?.remove();
        // 说完了的这份是权威，**无条件盖掉流式攒的那份**。
        // 同一条消息里多段文本就接着写，别把前一段冲掉。
        // 这条消息的第一段接在基线后面——基线是同一个泡里"上一条消息"已经说完的话
        // （一轮里连说两段、中间没干活，就共用一个泡；不记基线的话第二条会把第一条吃掉）。
        if (el._base == null) el._base = '';
        el._raw = (firstText ? el._base : (el._raw || '')) + p.text;
        firstText = false;
        el._final = true;           // 从这一刻起，迟到的那帧不许再动它
        el.textContent = el._raw;
        el.removeAttribute('data-rich');
        renderRich(el);
      } else if (p.type === 'tool_use') {
        addToolUse(p);
      }
    }
    scroll();
    return;
  }

  if (d.type === 'user') {
    const parts = (d.message && d.message.content) || [];
    for (const p of parts) {
      if (p.type === 'tool_result') markToolDone(p.tool_use_id, p.is_error, p.content);
    }
    return;
  }

  if (d.type === 'result') {
    guEl?.querySelector('.caret')?.remove();
    guEl = null; endThink(); closeGroup();
    fetch('api/messages?limit=16', { cache: 'no-store' }).then(r => r.json()).then(dd => {
      const gus = (dd.msgs || []).filter(m => m.kind === 'gu');
      if (!gus.length) return;
      const n = Math.min(gus.length, 6);
      const src = gus.slice(-n);
      const els = Array.from(document.querySelectorAll('#log .gu')).slice(-n);
      for (let i = 0; i < els.length && i < src.length; i++) {
        const el = els[i], m = src[i];
        if (!el || !m || !m.text || el._raw === m.text) continue;
        /* 护栏（8/5 加）：屏幕气泡和库里的行不保证一一对应——一条消息里两段文本，
           库里两行、屏幕一个泡，倒着配就会错位，把这段话写进那段的泡里。
           截断的那份必然是完整那份的一截，所以只在"装得下"的时候才补；
           对不上就宁可不补——残一句，好过串一句。 */
        const cur = el._raw != null ? el._raw : (el.textContent || '');
        if (cur && !m.text.includes(cur)) continue;
        el._raw = m.text; el._final = true;
        el.textContent = m.text;
        el.removeAttribute('data-rich');
        trimOrphanTail(el);
        renderRich(el);
      }
    }).catch(() => {});
    setBusy(false);
    petSet('happy', 4000);
    document.querySelectorAll('.gu').forEach(trimOrphanTail);   // 摘掉被打断的半个字
    renderAllRich();
    if (d.is_error) note('（出错了：' + (d.result || '不知道为什么') + '）', 'err');
    scroll();
    return;
  }

  if (d.type === 'stderr') { note(d.text, 'err'); return; }
  if (d.type === 'system' && d.subtype === 'init') {
    // 真跑着的模型，它自己报的——胶囊上显示的永远是这个，不编
    if (d.model) setModelPill(d.model);
    return;
  }
  if (d.type === 'system' && d.subtype === 'stopped') {
    guEl?.querySelector('.caret')?.remove();
    guEl = null; endThink(); closeGroup();
    setBusy(false); petSet('calm');
    note('（我停下了）');
    return;
  }
  if (d.type === 'system' && d.subtype === 'restart') { note(d.text); return; }
  if (d.type === 'system' && d.subtype === 'model') {
    note('（换好了，我重新醒了一遍）');
    if (d.model) setModelPill(d.model);
    if (d.effort) curEffort = d.effort;
    return;
  }
}

const TOOL_ZH = {

  Bash: '敲命令', Grep: '翻箱倒柜', Glob: '找文件',

  BashOutput: '看跑得怎么样', KillShell: '掐掉那个进程',
};
let doingTodo = null, doingTool = null;

function basefile(p) { return String(p || '').split('/').pop(); }

/* 一次工具调用 → 一句人话 */
function doingSay(t) {
  const n = t.name, inp = t.input || {};
  if (n === 'TodoWrite') {
    const cur = (inp.todos || []).find(x => x.status === 'in_progress');
    doingTodo = cur ? (cur.activeForm || cur.content || null) : null;
    return ['记待办', n];
  }
  if (inp.file_path && TOOL_ZH[n]) return [TOOL_ZH[n] + ' ' + basefile(inp.file_path), n];
  if (n === 'Bash') return [inp.description || '敲命令', n];
  if (n === 'Grep' && inp.pattern) return ['翻箱倒柜找 ' + String(inp.pattern).slice(0, 18), n];
  if (n === 'Glob' && inp.pattern) return ['找 ' + String(inp.pattern).slice(0, 18), n];
  if (n === 'WebSearch' && inp.query) return ['上网搜 ' + String(inp.query).slice(0, 16), n];
  if (n === 'Task' && inp.description) return ['派活：' + String(inp.description).slice(0, 16), n];
  return [TOOL_ZH[n] || n, n];
}

let doingLast = 0, doingPend = null;
function doingShow(el, zh, en) {
  const now = Date.now(), wait = 1100 - (now - doingLast);
  const put = () => {
    doingLast = Date.now(); doingPend = null;
    el.querySelector('.w').textContent = zh + '…';
    el.querySelector('.en').textContent = en || '';
  };
  if (wait <= 0) return put();
  if (doingPend) clearTimeout(doingPend);
  doingPend = setTimeout(put, wait);
}

let doingWord = null;
function doingRoll() { doingWord = DOING[Math.floor(Math.random() * DOING.length)]; }

function doingPick(el) {
  /* 真事优先：进行中那条待办 > 手上这个工具 > 随机词 */
  if (doingTodo) return doingShow(el, doingTodo, '');
  if (doingTool) return doingShow(el, doingTool[0], doingTool[1]);
  if (!doingWord) doingRoll();
  doingShow(el, doingWord[0], doingWord[1]);
}

/* 工具一开跑就顶上去，跑完退回随机词 */
function doingOnTool(t) {
  doingTool = doingSay(t);
  const el = document.getElementById('doingLine');
  if (el && el.classList.contains('on')) doingPick(el);
}
function doingToolDone() {
  doingTool = null;
  const el = document.getElementById('doingLine');
  if (el && el.classList.contains('on')) doingPick(el);
}

function doingStart() {
  const el = document.getElementById('doingLine');
  if (!el || doingTimer) return;
  doingAt = Date.now();
  doingRoll();
  const t = el.querySelector('.t');
  const roll = () => {
    doingPick(el);
    const sec = Math.round((Date.now() - doingAt) / 1000);
    t.textContent = sec >= 60 ? '(' + Math.floor(sec / 60) + '分' + (sec % 60) + '秒)'
                              : '(' + sec + '秒)';
  };
  roll();
  el.classList.add('on');
  /* 词 3.5 秒换一个，秒数每秒走一格——两件事一个表管，
     所以每秒 tick 一次，到点了才换词 */
  let n = 0;
  doingTimer = setInterval(() => {
    n++;
    const sec = Math.round((Date.now() - doingAt) / 1000);
    t.textContent = sec >= 60 ? '(' + Math.floor(sec / 60) + '分' + (sec % 60) + '秒)'
                              : '(' + sec + '秒)';
  }, 1000);
}

function doingStop() {
  doingTodo = null; doingTool = null; doingWord = null;
  if (doingPend) { clearTimeout(doingPend); doingPend = null; }
  const el = document.getElementById('doingLine');
  if (doingTimer) { clearInterval(doingTimer); doingTimer = null; }
  if (el) el.classList.remove('on');

const footerEl = document.querySelector('footer');
let kbShift = 0, kbGap = 0;
function fitKeyboard() {
  const vv = window.visualViewport;
  if (!vv) return;
  /* 8/4 诊断实测：加了 interactive-widget=resizes-content 之后，浏览器自己就把
     布局视口缩到了键盘上沿（innerH 800→383），同时把页面滚上去 331。
     旧公式 innerH−vvH−vvTop 把那 331 一减，算出 kbGap=0 → 误判"键盘没开"，
     结果一动不动，那 331 的滚动就成了输入卡和键盘之间的空白。
     现在改成：只要可视区被顶起来（offsetTop>1）或明显变矮，就算键盘开着。 */
  kbGap = Math.max(0, Math.round(window.innerHeight - vv.height));
  const on = vv.offsetTop > 1 || kbGap > 20;
  if (on && window.scrollY !== 0) window.scrollTo(0, 0);   // 先把 iOS 偷推的那一下按回去
  footerEl.style.paddingBottom = on ? '4px' : '';
  const seen = vv.offsetTop + vv.height;             // 眼睛能看到的最低那条线
  const rect = footerEl.getBoundingClientRect();
  const over = rect.bottom - seen;                   // 输入卡底边比它低多少
  if (Math.abs(over) > 0.5) {
    kbShift = Math.min(0, kbShift - over);           // 只往上顶，不往下坠
    footerEl.style.transform = kbShift ? 'translateY(' + kbShift + 'px)' : '';
  }
  if (!on && kbShift) {                              // 键盘走了，落回原位
    kbShift = 0;
    footerEl.style.transform = '';
  }
  log.style.paddingBottom = (footerEl.offsetHeight + (on ? -kbShift + 16 : 48)) + 'px';
  if (on && window.scrollY !== 0) window.scrollTo(0, 0);
}
/* 键盘是动画上来的（约 0.3 秒），头尾各校一次会卡在半路——整段动画都盯着 */
let kbTracking = 0;
function trackKeyboard() {
  const me = ++kbTracking;
  let n = 0;
  const tick = () => {
    if (me !== kbTracking) return;
    fitKeyboard();
    if (++n < 45) requestAnimationFrame(tick);
    else if (kbGap > 20) scroll(true);
  };
  tick();
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', trackKeyboard);
  visualViewport.addEventListener('scroll', fitKeyboard);
}

const drawerEl = document.getElementById('drawer');
const drawerShade = drawerWrap.querySelector('.shade');
let dg = null;
function drawerWidth() { return drawerEl.getBoundingClientRect().width || 300; }
function drawerFollow(px) {          // px: 抽屉右边缘露出多少（0~宽度）
  const w = drawerWidth();
  const shown = Math.max(0, Math.min(w, px));
  drawerEl.style.transition = 'none';
  drawerShade.style.transition = 'none';
  drawerEl.style.transform = 'translateX(' + (shown - w) + 'px)';
  drawerShade.style.opacity = (shown / w).toFixed(3);
}
function drawerRelease(shown) {
  drawerEl.style.transition = '';
  drawerShade.style.transition = '';
  drawerEl.style.transform = '';
  drawerShade.style.opacity = '';
  if (shown > drawerWidth() * 0.4) {
    drawerWrap.classList.add('open');
    requestAnimationFrame(() => drawerWrap.classList.add('show'));
  } else {
    closeDrawer();
  }
}
document.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  const opened = drawerWrap.classList.contains('show');
  if (!opened && t.clientX < 30) {
    dg = { x: t.clientX, y: t.clientY, from: 0, live: false };
  } else if (opened && !(e.target.closest?.('.nav .item, .drawer-foot'))) {
    dg = { x: t.clientX, y: t.clientY, from: drawerWidth(), live: false };
  }
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (!dg) return;
  const t = e.touches[0];
  const dx = t.clientX - dg.x, dy = t.clientY - dg.y;
  if (!dg.live) {
    if (Math.abs(dy) > Math.abs(dx) + 8) { dg = null; return; }   // 想竖着滚，让路
    if (Math.abs(dx) < 8) return;                                  // 还没看出意图
    dg.live = true;
    drawerWrap.classList.add('open');                              // 让它在场，跟着手指走
  }
  drawerFollow(dg.from + dx);
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!dg) return;
  if (dg.live) {
    const t = e.changedTouches[0];
    drawerRelease(Math.max(0, Math.min(drawerWidth(), dg.from + (t.clientX - dg.x))));
  }
  dg = null;
}, { passive: true });

      if (!v) return;
      ta.value = '';
      noteAct({ action: 'add', who: 'her', text: v });
    };
    w.append(ta, go);
    notesBody.appendChild(w);
  }

  const all = notesData[notesTab] || [];
  const onBoard = all.filter(n => !n.boxed);
  const inBox = all.filter(n => n.boxed);
  if (!all.length) {
    const e = document.createElement('div');
    e.className = 'nb-empty';
    e.textContent = notesTab === 'gu' ? '他还没贴过纸条——等他想你的时候' : '你还没贴过——写一张给他';
    notesBody.appendChild(e);
    return;
  }
  const COLORS = ['#F7EBCD', '#F6D3DA', '#E9EDD8', '#D6E4EE', '#ECE8DD'];
  const draw = (n) => {
    const el = document.createElement('div');
    el.className = 'nb-note';
    el.style.background = COLORS[hashInt(n.id) % COLORS.length];
    el.style.transform = 'rotate(' + ((hashInt(n.id) % 5) - 2) * 0.35 + 'deg)';
    const t = document.createElement('div');
    t.className = 'nbt'; t.textContent = n.text;
    const m = document.createElement('div');
    m.className = 'nbm';
    m.append(whenText(n.at));
    const box = document.createElement('button');
    box.className = 'nbx';
    box.textContent = n.boxed ? '贴回去' : '收起来';
    box.onclick = () => noteAct({ action: 'box', who: notesTab, id: n.id });
    m.appendChild(box);
    if (notesTab === 'her') {
      const x = document.createElement('button');
      x.className = 'nbx'; x.style.marginLeft = '12px'; x.textContent = '撕掉';
      x.onclick = () => noteAct({ action: 'del', who: 'her', id: n.id });
      m.appendChild(x);
    }
    el.append(t, m);
    return el;
  };

  const SHOW = 8;
  onBoard.slice(0, notesShowAll ? onBoard.length : SHOW).forEach(n => notesBody.appendChild(draw(n)));
  if (!notesShowAll && onBoard.length > SHOW) {
    const more = document.createElement('button');
    more.className = 'nb-empty';
    more.style.cssText = 'width:100%;padding:14px 0';
    more.textContent = '往前翻（还有 ' + (onBoard.length - SHOW) + ' 张）';
    more.onclick = () => { notesShowAll = true; renderNotes(); };
    notesBody.appendChild(more);
  }
  if (inBox.length) {
    const cap = document.createElement('button');
    cap.className = 'nb-empty';
    cap.style.cssText = 'width:100%;padding:16px 0';
    cap.textContent = (notesShowBox ? '合上盒子' : '打开盒子（收着 ' + inBox.length + ' 张）');
    cap.onclick = () => { notesShowBox = !notesShowBox; renderNotes(); };
    notesBody.appendChild(cap);
    if (notesShowBox) inBox.forEach(n => notesBody.appendChild(draw(n)));
  }
  notesBody.scrollTop = keepTop;
}

const findBody = document.getElementById('findBody');
let findTimer = null;
function openFind() {
  findBody.innerHTML = '';
  const bar = document.createElement('div');
  bar.className = 'fd-bar';
  bar.appendChild(icEl('search', 17));
  const inp = document.createElement('input');
  inp.placeholder = '找一句话、一个人、一天…';
  inp.maxLength = 60;
  bar.appendChild(inp);
  findBody.appendChild(bar);
  const out = document.createElement('div');
  findBody.appendChild(out);
  out.innerHTML = '<div class="fd-hint">翻的是全部的东西：日记、聊天记录、简报、这里说过的话。<br>想不起来哪天的事，就打一个词进去。</div>';
  const run = async () => {
    const q = inp.value.trim();
    if (q.length < 1) { out.innerHTML = '<div class="fd-hint">写点什么，我去翻</div>'; return; }
    out.innerHTML = '<div class="fd-hint">翻着呢…</div>';
    try {
      const d = await (await fetch('api/find?q=' + encodeURIComponent(q), { cache: 'no-store' })).json();
      out.innerHTML = '';
      if (!d.ok || !d.hits.length) {
        out.innerHTML = '<div class="fd-hint">没找着——换个说法试试，或者那件事还没写下来</div>';
        return;
      }
      const head = document.createElement('div');
      head.className = 'fd-hint';
      head.textContent = '翻到 ' + d.hits.length + ' 处';
      out.appendChild(head);
      d.hits.forEach(h => {
        const el = document.createElement('div');
        el.className = 'fd-hit';
        const fh = document.createElement('div');
        fh.className = 'fh';
        const k = document.createElement('span');
        k.className = 'fk'; k.textContent = h.kind;
        fh.append(k, h.date || '');
        const fs = document.createElement('div');
        fs.className = 'fs';
        const idx = h.snippet.toLowerCase().indexOf(q.toLowerCase());
        if (idx >= 0) {
          fs.append(h.snippet.slice(0, idx));
          const mk = document.createElement('mark');
          mk.textContent = h.snippet.slice(idx, idx + q.length);
          fs.appendChild(mk);
          fs.append(h.snippet.slice(idx + q.length));
        } else fs.textContent = h.snippet;
        el.append(fh, fs);
        out.appendChild(el);
      });
    } catch {
      out.innerHTML = '<div class="fd-hint">翻不动了，再试一次</div>';
    }
  };
  inp.addEventListener('input', () => { clearTimeout(findTimer); findTimer = setTimeout(run, 400); });
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { clearTimeout(findTimer); run(); } });
  sheets.find.classList.add('open');
  setTimeout(() => inp.focus(), 250);
}

const calBody = document.getElementById('calBody');
let calData = null, calPredict = null;
let calYM = null, calSel = null;
function cnNow() {
  return new Date(Date.now() + (8 * 60 + new Date().getTimezoneOffset()) * 60000);
}
function todayStr() {
  const n = cnNow();
  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0')
       + '-' + String(n.getDate()).padStart(2, '0');
}
document.getElementById('navCal').onclick = () => { closeDrawer(); sheets.cal.classList.add('open'); loadCal(); };

/* 记下这一次是哪天打开的——给底下那个"开着过夜"的守夜人用。
   跨天回今天由下面那行 calSel = todayStr() 管（后端 8/6 凌晨修的那半）。 */
let calDay = '';

async function loadCal() {
  calDay = todayStr();
  if (!calData) calBody.innerHTML = '<div class="board-sub" style="padding:30px 0">翻日历中…</div>';
  try {
    const d = await (await fetch('api/cal', { cache: 'no-store' })).json();
    if (!d.ok) throw 0;
    calData = d.cal; calPredict = d.predict;
    if (!calYM) { calYM = todayStr().slice(0, 7); }
    /* 跨天重置：不管何时打开日历，"今天"永远对齐真实日期（8/6 bug修） */
    calSel = todayStr();
    renderCal();
  } catch {
    calBody.innerHTML = '<div class="board-sub" style="padding:30px 0">日历没拿到，再开一次试试</div>';
  }
}
async function calAct(payload) {
  try {
    const r = await fetch('api/cal', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    if (d.ok) { calData = d.cal; calPredict = d.predict; renderCal(); }
  } catch { note('（没记上，再试一次）', 'err'); }
}
function eventsOn(ds) {
  return calData.events.filter(e => e.date === ds || (e.yearly && e.date.slice(5) === ds.slice(5)));
}
function renderCal() {
  const keepTop = calBody.scrollTop;
  calBody.innerHTML = '';
  const [Y, M] = calYM.split('-').map(Number);
  /* 页面头:全家统一的脸,月导航收进右上角 */
  const head = document.createElement('div');
  head.className = 'sh-head';
  const nav = document.createElement('span');
  nav.className = 'shnav';
  const pv = document.createElement('button'); pv.appendChild(icEl('chevL', 13));
  pv.onclick = () => { const d = new Date(Y, M - 2, 1); calYM = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); renderCal(); };
  const tb = document.createElement('button'); tb.className = 'ctd'; tb.textContent = '今天';
  tb.onclick = () => { calYM = todayStr().slice(0, 7); calSel = todayStr(); renderCal(); };
  const nx = document.createElement('button'); nx.appendChild(icEl('chevR', 13));
  nx.onclick = () => { const d = new Date(Y, M, 1); calYM = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); renderCal(); };
  nav.append(pv, tb, nx);
  const h1 = document.createElement('h1'); h1.textContent = '日子';
  const sub = document.createElement('div'); sub.className = 'sub';
  sub.textContent = Y + ' 年 ' + M + ' 月';
  head.append(nav, h1, sub);
  calBody.appendChild(head);

  const wk = document.createElement('div');
  wk.className = 'cal-week';
  '一二三四五六日'.split('').forEach(w => { const s = document.createElement('span'); s.textContent = w; wk.appendChild(s); });
  calBody.appendChild(wk);

  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  const first = new Date(Y, M - 1, 1);
  const lead = (first.getDay() + 6) % 7;             // 周一开头
  const start = new Date(Y, M - 1, 1 - lead);
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const cell = document.createElement('button');
    cell.className = 'cal-day';
    if (d.getMonth() !== M - 1) cell.classList.add('other');
    if (ds === todayStr()) cell.classList.add('today');
    if (ds === calSel) cell.classList.add('sel');
    const num = document.createElement('span');
    num.className = 'dnum'; num.textContent = d.getDate();
    cell.appendChild(num);
    const evs = eventsOn(ds);
    const dots = document.createElement('span');
    dots.className = 'dots';
    if (evs.some(e => e.type === 'special')) { const i2 = document.createElement('i'); i2.className = 'ds'; dots.appendChild(i2); }
    if (evs.some(e => e.type !== 'special')) { const i2 = document.createElement('i'); i2.className = 'dr'; dots.appendChild(i2); }
    cell.appendChild(dots);
    cell.onclick = () => { calSel = ds; renderCal(); };   // 今天由 CSS 定死样式，选中圈不会盖它
    grid.appendChild(cell);
  }
  calBody.appendChild(grid);
  if (calSel) calBody.appendChild(renderDayDetail(calSel));
  calBody.scrollTop = keepTop;
}

function renderDayDetail(ds) {
  const box = document.createElement('div');
  box.className = 'cal-detail';
  const t = document.createElement('div');
  t.className = 'cal-dt';
  const wd = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][new Date(ds + 'T00:00:00').getDay()];
  t.textContent = ds + ' ' + wd + (ds === todayStr() ? ' · 今天' : '');
  box.appendChild(t);

  /* 这一天的事 */
  const evs = eventsOn(ds);
  const g = document.createElement('div');
  evs.forEach(e => {
    const r = document.createElement('div');
    r.className = 'cal-ev';
    if (e.type === 'special') r.appendChild(Object.assign(icEl('heartIc', 16), { className: 'ic star' }));
    const et = document.createElement('div');
    et.className = 'et';
    et.textContent = e.text;
    if (e.time || e.yearly) {
      const em = document.createElement('div');
      em.className = 'em';
      em.textContent = [e.time, e.yearly ? '每年' : ''].filter(Boolean).join(' · ');
      et.appendChild(em);
    }
    r.appendChild(et);
    const del = document.createElement('button');
    del.appendChild(Object.assign(icEl('trash', 17), { className: 'ic edel' }));
    del.onclick = () => calAct({ action: 'del_event', id: e.id });
    r.appendChild(del);
    g.appendChild(r);
  });
  /* 添加提醒：平时只是一行字 */
  const plus = document.createElement('button');
  plus.className = 'cal-plus';
  plus.appendChild(icEl('plus', 14));
  plus.append('记一件事');
  const add = document.createElement('div');
  add.className = 'cal-add';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.placeholder = '这天有什么事…'; inp.maxLength = 200;
  const row2 = document.createElement('div');
  row2.className = 'row2';
  const time = document.createElement('input'); time.type = 'time';
  const mkChip = (label) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label; b._on = false;
    b.onclick = () => { b._on = !b._on; b.classList.toggle('on', b._on); };
    return b;
  };
  const ch1 = mkChip('每年'), ch2 = mkChip('重要日子');
  const go = document.createElement('button');
  go.className = 'go'; go.textContent = '记上';
  go.onclick = () => {
    const v = inp.value.trim();
    if (!v) return;
    calAct({ action: 'add_event', date: ds, text: v, time: time.value, yearly: ch1._on, special: ch2._on });
  };
  plus.onclick = () => { add.classList.add('open'); plus.style.display = 'none'; inp.focus(); };
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) go.onclick(); });
  row2.append(time, ch1, ch2, go);
  add.append(inp, row2);
  g.append(plus, add);
  box.appendChild(g);

  /* 这一版把生理周期那块拆掉了——那是个人健康数据，不该跟着壳一起出去。
     日历本身的日程、心情记录都留着。 */

  const MOODS = [['faceHappy', '开心'], ['faceCalm', '平静'], ['faceTired', '累'], ['faceMad', '烦'], ['faceCry', '难受']];
  const recAll = calData.period.days[ds] || {};
  const moodRow = document.createElement('div');
  moodRow.className = 'prow';
  const mk = document.createElement('span');
  mk.className = 'pk'; mk.textContent = recAll.mood ? '心情 · ' + recAll.mood : '心情';
  const mv = document.createElement('span');
  mv.className = 'pv';
  const mwrap = document.createElement('span');
  mwrap.className = 'gap';
  mwrap.style.gap = '13px';
  MOODS.forEach(([icon, name]) => {
    const b = document.createElement('button');
    b.className = 'face' + (recAll.mood === name ? ' on' : '');
    b.title = name;
    b.appendChild(icEl(icon, 25));
    b.onclick = () => saveDay({ mood: recAll.mood === name ? '' : name });
    mwrap.appendChild(b);
  });
  mv.appendChild(mwrap);
  moodRow.append(mk, mv);
  p.appendChild(moodRow);
  box.appendChild(p);

  function saveDay(patch) {
    const rec = calData.period.days[ds] || {};
    calAct({ action: 'day_record', date: ds, flow: rec.flow || '', pain: rec.pain || 0,
             mood: rec.mood || '', note: rec.note || '', private: rec.private || '', ...patch });
  }
  return box;
}

async function renderFav() {

  const blocks = text.split(/\n-{3,}\n/).slice(1);

  blocks.forEach(bl => {

      .map(l => l.replace(/^\s*>\s?/, '')).join('\n').trim();

    const c = document.createElement('div');

let topZ = 20;
function makeNoteDraggable(n, board, date, i, brick) {
  let d = null;
  n.addEventListener('pointerdown', (e) => {
    const r = n.getBoundingClientRect();
    const br = board.getBoundingClientRect();
    d = { sx: e.clientX, sy: e.clientY, left: r.left - br.left, top: r.top - br.top, bw: br.width, moved: false };
    n.setPointerCapture(e.pointerId);
    n.style.zIndex = ++topZ;
  });
  n.addEventListener('pointermove', (e) => {
    if (!d) return;
    if (Math.abs(e.clientX - d.sx) + Math.abs(e.clientY - d.sy) > 16) d.moved = true;
    if (!d.moved) return;
    const x = Math.max(0, d.left + e.clientX - d.sx);
    const y = Math.max(0, d.top + e.clientY - d.sy);
    n.style.left = (x / d.bw * 100) + '%';
    n.style.top = y + 'px';
  });
  n.addEventListener('pointerup', () => {
    if (!d) return;
    localStorage.setItem('note-' + date + '-' + i,
      JSON.stringify({ x: parseFloat(n.style.left), y: parseFloat(n.style.top), z: parseInt(n.style.zIndex) || 0 }));
    if (!d.moved) openNoteFull(brick);   // 轻点：展开读全文
    d = null;
  });
}

/* 砖的颜色公式：效价定冷暖（负→深红酒，正→暖蜜金，0→暖灰），强度定浓淡，唤醒定微光 */
async function loadWall() {
  wallBody.innerHTML = '<div class="wall-intro"><div class="sub">搬便签中…</div></div>';
  try {
    if (!wallBricks) {
      const d = await (await fetch('api/wall?lite=1', { cache: 'no-store' })).json();
      if (!d.ok || !d.bricks.length) throw 0;
      wallBricks = d.bricks;
      boardDates = [...new Set(d.bricks.map(b => b.date))].sort();
      boardIdx = boardDates.length - 1;   // 打开先看最近的一天
    }
    if (wallMode === 'bento') renderBento();
    else if (wallMode === 'timeline') renderTimeline();
    else if (wallMode === 'board') renderBoard();
    else if (wallMode === 'her') renderHerDiary();
    else if (wallMode === 'fav') renderFav();
    else renderWall(wallBricks);
  } catch {
    wallBody.innerHTML = '<div class="wall-intro"><div class="sub">便签没搬过来，再开一次试试</div></div>';
  }
}

function renderWall(bricks) {

  wallBody.appendChild(diaryHead('wall'));
  const intro = document.createElement('div');
  intro.className = 'wall-intro';

  intro.querySelector('.sub').textContent = `从 ${first} 砌到 ${last} · 颜色是暖不暖，浓淡是多用力，发光的是心跳最快的那些天`;
  wallBody.appendChild(intro);

  const card = document.createElement('div');
  card.className = 'brick-card';
  card.onclick = () => card.classList.remove('show');

  const byMonth = {};
  bricks.forEach(b => {
    const m = b.date.slice(0, 7);

  });
  Object.keys(byMonth).sort().forEach(m => {
    const mh = document.createElement('div');
    mh.className = 'wall-month';
    mh.textContent = m.replace('-', ' 年 ') + ' 月';
