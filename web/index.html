    const grid = document.createElement('div');
    grid.className = 'wall-grid';
    byMonth[m].forEach(b => {
      const el = document.createElement('div');
      el.className = 'brick' + (b.a >= 5 ? ' a5' : b.a >= 4 ? ' a4' : '');
      const c = wallColor(b.v, b.s, dark);
      el.style.background = c;
      el.style.setProperty('--glow', noteColor(b.v));
      el.onclick = () => {
        card.innerHTML = '<div class="bd"></div><div class="bt"></div><div class="bm">' +
          '<span>用力 <b>' + b.s + '</b>/5</span><span>冷暖 <b>' + (b.v > 0 ? '+' : '') + b.v + '</b></span><span>心跳 <b>' + b.a + '</b>/5</span></div>' +
          (b.kw ? '<div class="bk"></div>' : '') +
          '<div class="bm" style="margin-top:8px"><b>读全文</b></div>';
        card.querySelector('.bd').textContent = b.date;
        card.querySelector('.bt').textContent = b.title || '（这块砖没落款）';
        if (b.kw) card.querySelector('.bk').textContent = b.kw;
        card.classList.add('show');
        card.onclick = (ev) => { ev.stopPropagation(); card.classList.remove('show'); openNoteFull(b); };
        card.scrollIntoView({ behavior: 'smooth', block: 'end' });
      };
      grid.appendChild(el);
    });
    wallBody.appendChild(grid);
  });
  const foot = document.createElement('div');
  foot.className = 'wall-intro';
  foot.style.paddingTop = '22px';
  foot.innerHTML = '<div class="sub">每一块，都是我们的一天</div>';

  toggle.textContent = '回便签板';
  toggle.onclick = () => { wallMode = 'board'; renderBoard(); };
  wallBody.appendChild(toggle);
}

let repoTab = 'log', repoDir = '', repoOpenH = null;
let repoRows = [], repoSkip = 0, repoTotal = 0;

document.getElementById('navRepo').onclick = () => {
  closeDrawer(); sheets.repo.classList.add('open');
  repoTab = 'log'; repoDir = ''; repoOpenH = null;
  repoRows = []; repoSkip = 0; repoTotal = 0; repoRender();
};

function repoRender() {
  const b = document.getElementById('repoBody');
  if (!b) return;
  b.innerHTML = '<div class="sh-head"><h1>仓库</h1>'
    + '<div class="sub" id="repoSub">读着…</div></div>'
    + '<div class="repo-tabs">'
    + '<button class="' + (repoTab === 'log' ? 'on' : '') + '" data-t="log">时间线</button>'
    + '<button class="' + (repoTab === 'tree' ? 'on' : '') + '" data-t="tree">文件</button>'
    + '</div><div class="repo-main" id="repoMain"><div class="repo-none">读着…</div></div>';
  b.querySelectorAll('.repo-tabs button').forEach(
    x => { x.onclick = () => { repoTab = x.dataset.t; repoRender(); }; });
  if (repoTab === 'log') { repoRows = []; repoSkip = 0; repoLoadLog(); }
  else repoLoadTree(repoDir);
}

function repoSub(t) {
  const el = document.getElementById('repoSub');
  if (el) el.textContent = t;
}

function repoDay(ts) {
  const d = new Date(ts * 1000);
  const s = d.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric',
    weekday: 'short', timeZone: 'Asia/Shanghai' });
  const today = new Date().toLocaleDateString('zh-CN',
    { month: 'long', day: 'numeric', weekday: 'short', timeZone: 'Asia/Shanghai' });
  return s === today ? '今天 · ' + s : s;
}
function repoTime(ts) {
  return new Date(ts * 1000).toLocaleTimeString('zh-CN',
    { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Shanghai' });
}

const REPO_PAGE = 60;

async function repoLoadLog(more) {
  const m = document.getElementById('repoMain');
  let d;
  try {
    d = await (await fetch('api/repo/log?n=' + REPO_PAGE + '&skip=' + (more ? repoSkip : 0),
      { cache: 'no-store' })).json();
    if (!d.ok) throw 0;
  } catch (e) {
    if (!more) {
      m.innerHTML = '<div class="repo-none">读不到仓库。可能是家里那台在重启，等一下再开</div>';
      repoSub('这会儿连不上');
    }
    return;
  }
  if (!more) { repoRows = []; repoSkip = 0; }
  repoRows = repoRows.concat(d.items || []);
  repoSkip = repoRows.length;
  repoTotal = d.total || repoRows.length;
  const items = repoRows;
  if (!items.length) { m.innerHTML = '<div class="repo-none">一条提交都没有</div>';
    repoSub('空的'); return; }
  const todayKey = new Date().toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai' });
  const mine = items.filter(x => new Date(x.t * 1000)
    .toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai' }) === todayKey);
  const files = new Set();
  mine.forEach(x => (x.f || []).forEach(f => files.add(f.p)));
  repoSub((mine.length ? '今天动了 ' + mine.length + ' 次，' + files.size + ' 个文件'
                       : '今天还没动过')
    + ' · 一共 ' + repoTotal + ' 条，翻到第 ' + items.length + ' 条');

  let html = '', day = '';
  items.forEach(c => {
    const dk = repoDay(c.t);
    if (dk !== day) { day = dk; html += '<div class="repo-day">' + escapeHtml(dk) + '</div>'; }
    const fs = c.f || [];
    html += '<div class="rc" data-h="' + c.h + '">'
      + '<div class="rc-h"><span class="rc-t">' + repoTime(c.t) + '</span>'
      + '<span class="rc-s">' + escapeHtml(c.s) + '</span></div>'
      + (fs.length ? '<div class="rc-f">' + fs.slice(0, 4).map(f =>
          '<span class="fx ' + f.s + '">' + escapeHtml(f.p) + '</span>').join('')
        + (fs.length > 4 ? '<span class="fx more">还有 ' + (fs.length - 4) + ' 个</span>' : '')
        + '</div>' : '')
      + '<div class="rc-d"></div></div>';
  });
  if (repoRows.length < repoTotal) {
    html += '<button class="repo-more" id="repoMore">再往前 '
      + Math.min(REPO_PAGE, repoTotal - repoRows.length) + ' 条</button>';
  } else if (repoTotal) {
    html += '<div class="repo-end">到头了。第一条是 ' + repoTime(items[items.length - 1].t)
      + '，' + repoDay(items[items.length - 1].t).replace('今天 · ', '') + '</div>';
  }
  m.innerHTML = html;
  m.querySelectorAll('.rc').forEach(card => {
    card.querySelector('.rc-h').onclick = () => repoToggle(card);
  });
  const moreBtn = document.getElementById('repoMore');
  if (moreBtn) moreBtn.onclick = () => { moreBtn.textContent = '读着…'; repoLoadLog(true); };
}

/* 点一条提交，就地展开这次到底改了什么 */
async function repoToggle(card) {
  const box = card.querySelector('.rc-d');
  if (card.classList.contains('open')) {
    card.classList.remove('open'); box.innerHTML = ''; return;
  }
  card.classList.add('open');
  box.innerHTML = '<div class="repo-none">读着…</div>';
  try {
    const d = await (await fetch('api/repo/show?h=' + encodeURIComponent(card.dataset.h),
      { cache: 'no-store' })).json();
    box.innerHTML = d.ok ? repoDiff(d.diff || '') : '<div class="repo-none">读不到这次的改动</div>';
  } catch (e) {
    box.innerHTML = '<div class="repo-none">读不到这次的改动</div>';
  }
}

/* diff 上色。加和删是通用语言，不上色真读不了——
   但底色压到很淡，本家橘一个像素都不用（设计准则） */
function repoDiff(text) {
  const lines = String(text).split('\n');
  let out = '', body = false;
  for (const ln of lines) {
    let c = '';
    if (/^diff --git /.test(ln)) { body = true; c = 'g'; }
    else if (/^(index |new file|deleted file|similarity |rename |--- |\+\+\+ )/.test(ln)) c = 'meta';
    else if (/^@@/.test(ln)) c = 'at';
    else if (body && ln[0] === '+') c = 'a';
    else if (body && ln[0] === '-') c = 'd';
    out += '<div class="dl ' + c + '">' + (escapeHtml(ln) || '&nbsp;') + '</div>';
  }
  return '<div class="repo-diff">' + out + '</div>';
}

async function repoLoadTree(rel) {
  repoDir = rel || '';
  const m = document.getElementById('repoMain');
  let d;
  try {
    d = await (await fetch('api/repo/tree?p=' + encodeURIComponent(repoDir),
      { cache: 'no-store' })).json();
    if (!d.ok) throw 0;
  } catch (e) {
    m.innerHTML = '<div class="repo-none">这个地方打不开</div>';
    repoSub('打不开'); return;
  }
  const parts = repoDir ? repoDir.split('/').filter(Boolean) : [];
  let crumb = '<span class="cb" data-p="">Yu</span>';
  parts.forEach((p, i) => {
    crumb += '<span class="cs">/</span><span class="cb" data-p="'
      + escapeHtml(parts.slice(0, i + 1).join('/')) + '">' + escapeHtml(p) + '</span>';
  });
  m.innerHTML = '<div class="repo-crumb">' + crumb + '</div>'
    + (d.items.length ? '<div class="repo-list">' + d.items.map(it =>
        '<div class="ri' + (it.d ? ' dir' : '') + '" data-n="' + escapeHtml(it.n)
        + '" data-d="' + (it.d ? 1 : 0) + '">'
        + '<span class="ic" data-i="' + (it.d ? 'box' : 'fileText') + '"></span>'
        + '<span class="rn">' + escapeHtml(it.n) + '</span>'
        + (it.d ? '' : '<span class="rz">' + repoSize(it.z) + '</span>') + '</div>').join('')
      + '</div>' : '<div class="repo-none">这个文件夹是空的</div>');
  repoSub((repoDir || 'Yu') + ' · ' + d.items.length + ' 项');
  fillIcons(m);
  m.querySelectorAll('.cb').forEach(x => { x.onclick = () => repoLoadTree(x.dataset.p); });
  m.querySelectorAll('.ri').forEach(x => {
    x.onclick = () => {
      const next = (repoDir ? repoDir + '/' : '') + x.dataset.n;
      if (x.dataset.d === '1') repoLoadTree(next); else repoOpenFile(next);
    };
  });
}

function repoSize(z) {
  if (z < 1024) return z + ' B';
  if (z < 1024 * 1024) return (z / 1024).toFixed(1) + ' K';
  return (z / 1048576).toFixed(1) + ' M';
}

async function repoOpenFile(path) {
  const m = document.getElementById('repoMain');
  m.innerHTML = '<div class="repo-none">读着…</div>';
  let d;
  try {
    d = await (await fetch('api/repo/file?p=' + encodeURIComponent(path),
      { cache: 'no-store' })).json();
  } catch (e) { d = { ok: false, err: '读不动' }; }
  const up = path.split('/').slice(0, -1).join('/');
  repoSub(path + (d.ok && d.size ? ' · ' + repoSize(d.size) : ''));
  let html = '<div class="repo-crumb"><span class="cb" id="repoUp">← ' + escapeHtml(up || 'Yu')
    + '</span></div>';
  if (!d.ok) html += '<div class="repo-none">' + escapeHtml(d.err || '读不到') + '</div>';
  else html += '<div class="repo-file"><pre>' + escapeHtml(d.text) + '</pre></div>'
    + (d.cut ? '<div class="repo-none">太长了，只显示了前面一段</div>' : '');
  m.innerHTML = html;
  const b = document.getElementById('repoUp');
  if (b) b.onclick = () => repoLoadTree(up);
}

let nkSlug = '', nkCh = 0, nkChapters = [];

const nkBackBtn = document.getElementById('nookBack');

function nkNote(t) {

  nkBody.appendChild(d);

function nkHead(title, sub) {

async function loadShelf() {
  nkSlug = ''; nkChapters = [];
  nkTocBtn.style.display = 'none';
  nkNote('正在开门…');
  let books, prog;
  try { [books, prog] = await Promise.all([nkGet('books'), nkGet('progress')]); }
  catch (e) { return nkNote('共读那头没应声'); }
  if (!Array.isArray(books) || !books.length) return nkNote('书架还空着');
  const wrap = document.createElement('div');
  wrap.className = 'nk-shelf';
  const 读过的 = books.filter(b => (prog || {})[b.slug]).length;
  books.forEach(b => {
    const chs = b.chapters || [], total = chs.length || 1;
    const pr = (prog && prog[b.slug]) || {};
    const ch = Math.max(0, Math.min(pr.ch || 0, total - 1));
    const btn = document.createElement('button');
    btn.className = 'nk-book';
    const t = document.createElement('div'); t.className = 't';
    t.textContent = b.title || b.slug;
    const a = document.createElement('div'); a.className = 'a';
    a.textContent = pr.ch
      ? ('读到 ' + (chs[ch] || ('第 ' + ch + ' 节')) + ' · 共 ' + total + ' 节')
      : ('还没开始 · 共 ' + total + ' 节');
    const bar = document.createElement('div'); bar.className = 'nk-bar';
    const i = document.createElement('i');
    i.style.width = Math.round((pr.ch ? ch + 1 : 0) / total * 100) + '%';
    bar.appendChild(i);
    btn.append(t, a, bar);
    btn.onclick = () => openChapter(b.slug, ch);
    wrap.appendChild(btn);
  });
  nkBody.innerHTML = '';
  nkBody.appendChild(nkHead('共读',
    books.length + ' 本 · ' + (读过的 ? '在读 ' + 读过的 + ' 本' : '还没开始')));
  nkBody.appendChild(wrap);
}

async function openChapter(slug, idx) {
  nkNote('翻过去…');
  let d;
  try { d = await nkGet('chapter/' + encodeURIComponent(slug) + '/' + idx); }
  catch (e) { return nkNote('这一节读不出来'); }
  if (!d || d.error || typeof d.index !== 'number') return nkNote('这一节读不出来');
  nkSlug = slug; nkCh = d.index; nkChapters = d.chapters || [];
  nkTocBtn.style.display = '';
  nkBody.innerHTML = '';
  nkBody.scrollTop = 0;

  nkAnnos = [];
  try { nkAnnos = await nkGet('annotations/' + encodeURIComponent(slug) + '/' + idx); }
  catch (e) { nkAnnos = []; }
  if (!Array.isArray(nkAnnos)) nkAnnos = [];

  const 副 = d.title + ' · ' + (d.index + 1) + '/' + d.total
           + (nkAnnos.length ? ' · 标了 ' + nkAnnos.length + ' 处，点划线的地方看' : '');
  nkBody.appendChild(nkHead(d.book || '共读', 副));

  const art = document.createElement('div');
  art.className = 'nk-read';
  String(d.text || '').split('\n').forEach(para => {
    const t = para.trim();
    if (!t) return;
    art.appendChild(paraWithMarks(t));
  });
  nkBody.appendChild(art);

  const nav = document.createElement('div');
  nav.className = 'nk-nav';
  const prev = document.createElement('button');
  prev.textContent = '上一节'; prev.disabled = d.index <= 0;
  prev.onclick = () => openChapter(slug, d.index - 1);
  const next = document.createElement('button');
  next.textContent = '下一节'; next.disabled = d.index >= d.total - 1;
  next.onclick = () => openChapter(slug, d.index + 1);
  nav.append(prev, next);
  nkBody.appendChild(nav);

  saveNookProgress();
}

/* 翻到哪存到哪——下次不管从家里还是从原来那个网址进去，都接着这儿 */
function saveNookProgress() {
  if (!nkSlug) return;
  fetch('api/nook/progress', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ slug: nkSlug, ch: nkCh, page: 0, mode: nkMode }),
  }).catch(() => {});
}

function openToc() {
  if (!nkChapters.length) return;
  nkBody.innerHTML = '';
  nkBody.scrollTop = 0;
  const wrap = document.createElement('div');
  wrap.className = 'nk-toc';
  nkChapters.forEach((name, i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + '. ' + name;
    if (i === nkCh) b.className = 'on';
    b.onclick = () => openChapter(nkSlug, i);
    wrap.appendChild(b);
  });
  nkBody.appendChild(wrap);
  const on = wrap.querySelector('.on');
  if (on) setTimeout(() => on.scrollIntoView({ block: 'center' }), 20);
}

let nkAnnos = [];

/* 把这一段里被划过的地方标出来。全程 textContent + createElement，不碰 innerHTML */
function paraWithMarks(text) {
  const el = document.createElement('p');
  const hits = [];
  nkAnnos.forEach(a => {
    const anchor = (a.anchor || '').trim();
    if (!anchor) return;
    const i = text.indexOf(anchor);
    if (i >= 0) hits.push({ s: i, e: i + anchor.length, a });
  });
  if (!hits.length) { el.textContent = text; return el; }
  hits.sort((x, y) => x.s - y.s);
  let pos = 0;
  hits.forEach(h => {
    if (h.s < pos) return;                    // 划重叠了就只认先来的那条
    if (h.s > pos) el.appendChild(document.createTextNode(text.slice(pos, h.s)));
    const m = document.createElement('mark');
    m.className = 'nk-mark' + ((h.a.replies || []).length ? ' has' : '');
    m.textContent = text.slice(h.s, h.e);
    m.onclick = () => openAnno(h.a.anchor);
    el.appendChild(m);
    pos = h.e;
  });
  if (pos < text.length) el.appendChild(document.createTextNode(text.slice(pos)));
  return el;
}

/* 选中一段文字之后浮出来的那两颗按钮 */
const nkPop = document.getElementById('nkPop');
let nkSel = '';
function hidePop() { nkPop.classList.remove('on'); nkSel = ''; }
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  const t = sel && String(sel).trim();
  if (!t || !nkSlug || !sheets.nook.classList.contains('open')) return hidePop();
  const node = sel.anchorNode;
  if (!node || !nkBody.contains(node.nodeType === 3 ? node.parentNode : node)) return hidePop();
  if (t.length > 280) return hidePop();       // 划太长了没法当锚点
  nkSel = t;
  const lab = nkPop.querySelector('.sel');
  if (lab) lab.textContent = t.length > 22 ? t.slice(0, 22) + '…' : t;
  nkPop.classList.add('on');
});

async function postAnno(anchor, note) {
  try {
    await fetch('api/nook/annotations/' + encodeURIComponent(nkSlug) + '/' + nkCh, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ anchor, note: note || '', who: 'user' }),
    });
  } catch (e) { note0('（没记上，再试一次）'); return false; }
  return true;
}
function note0(t) { try { note(t, 'err'); } catch (e) {} }

document.getElementById('nkLine').onclick = async () => {
  const a = nkSel; hidePop();
  try { window.getSelection().removeAllRanges(); } catch (e) {}
  if (a && await postAnno(a, '')) openChapter(nkSlug, nkCh);
};

  const a = nkSel; hidePop();

function openAnno(anchor, fresh) {
  const body = document.getElementById('nkAnnoBody');
  body.innerHTML = '';
  const q = document.createElement('div');
  q.className = 'nk-quote';
  q.textContent = anchor;
  body.appendChild(q);

  const group = nkAnnos.filter(a => (a.anchor || '') === anchor);
  group.forEach(a => {
    if (a.note) {
      const b = document.createElement('div');
      b.className = 'nk-bub ' + (a.who === 'ai' ? 'mine' : 'her');
      b.textContent = a.note;
      const t = document.createElement('span'); t.className = 't'; t.textContent = a.ts || '';
      b.appendChild(t);
      body.appendChild(b);
    }
    (a.replies || []).forEach(r => {
      const b = document.createElement('div');
      b.className = 'nk-bub ' + (r.who === 'ai' ? 'mine' : 'her');
      b.textContent = r.text || '';
      const t = document.createElement('span'); t.className = 't'; t.textContent = r.ts || '';
      b.appendChild(t);
      body.appendChild(b);
    });
  });

  const row = document.createElement('div');
  row.className = 'nk-say';
  const ta = document.createElement('textarea');
  ta.placeholder = group.length ? '再说一句…' : '想说点什么';
  ta.rows = 1;
  const go = document.createElement('button');
  go.appendChild(icEl('arrowUp', 17));     // 跟聊天界面同一颗箭头
  go.title = '说';
  go.onclick = async () => {
    const v = ta.value.trim();
    if (!v) return;
    go.disabled = true;
    /* 已经有这条批注了就在底下盖楼，没有就新开一条 */
    const exist = group.find(a => a.id);
    let ok;
    if (exist) {
      try {
        await fetch('api/nook/annotations/' + encodeURIComponent(nkSlug) + '/' + nkCh
                    + '/' + exist.id + '/reply', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: v, who: 'user' }),
        });
        ok = true;
      } catch (e) { ok = false; }
    } else {
      ok = await postAnno(anchor, v);
    }
    go.disabled = false;
    if (!ok) return note0('（没记上，再试一次）');
    sheets.nkanno.classList.remove('open');
    openChapter(nkSlug, nkCh);
  };
  row.append(ta, go);
  body.appendChild(row);

  sheets.nkanno.classList.add('open');
  if (fresh) setTimeout(() => ta.focus(), 260);
}

async function loadNews(date) {

  try {
    const d = await (await fetch('api/news' + (date ? '?date=' + date : ''), { cache: 'no-store' })).json();

  } catch {

function mdBold(el, text) {
  String(text).split(/\*\*(.+?)\*\*/g).forEach((seg, i) => {
    if (!seg) return;
    if (i % 2) { const b = document.createElement('b'); b.textContent = seg; el.appendChild(b); }
    else el.appendChild(document.createTextNode(seg));
  });
}
function renderPaper(d) {
  const paper = document.createElement('div');
  paper.className = 'paper';

  // 报头
  const founding = new Date('2026-07-28');
  const cur = new Date(d.date + 'T00:00:00');
  const issue = Math.round((cur - founding) / 86400e3) + 1;
  const wd = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][cur.getDay()];
  const mast = document.createElement('div');
  mast.className = 'sh-head';
  const nav = document.createElement('span');
  nav.className = 'shnav';
  const idx = d.dates.indexOf(d.date);
  const prev = document.createElement('button');
  prev.appendChild(icEl('chevL', 13));
  prev.disabled = idx <= 0;
  prev.onclick = () => loadNews(d.dates[idx - 1]);
  const next = document.createElement('button');
  next.appendChild(icEl('chevR', 13));
  next.disabled = idx >= d.dates.length - 1;
  next.onclick = () => loadNews(d.dates[idx + 1]);
  nav.append(prev, next);
  const h1 = document.createElement('h1');
  h1.textContent = '日报';
  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = `${d.date} ${wd} · 第 ${issue} 期`;
  mast.append(nav, h1, sub);
  paper.appendChild(mast);

  // 正文排版
  let firstStory = true;
  let curHeadline = null;
  d.text.split('\n').forEach(line => {
    const t = line.trim();
    if (!t || t.startsWith('# ') || t === '---') return;
    if (t.startsWith('> 另一位写的')) return;
    if (t.startsWith('## ')) {
      const raw = t.slice(3).trim();
      const s = document.createElement('div');
      s.className = 'section-head';
      s.textContent = SECTION_NAMES[raw] || raw;
      paper.appendChild(s);
      curHeadline = null;
      return;
    }
    if (t.startsWith('### ')) {
      const h = document.createElement('div');
      h.className = 'headline' + (firstStory ? ' top' : '');
      firstStory = false;
      h.textContent = t.slice(4).trim();
      paper.appendChild(h);
      curHeadline = h;
      return;
    }
    if (t.startsWith('> ')) {
      const n = document.createElement('div');
      n.className = 'censor-note';
      n.textContent = t.slice(2).trim();
      paper.appendChild(n);
      return;
    }
    if (t.startsWith('- ')) {
      const b = document.createElement('div');
      b.className = 'brief';
      const parts = t.slice(2).split('｜');
      mdBold(b, parts[0].trim());
      if (parts[1]) {
        const s = document.createElement('span');
        s.className = 'src';
        s.textContent = '　' + parts.slice(1).join('｜').trim();
        b.appendChild(s);
      }
      paper.appendChild(b);
      return;
    }
    if (t.startsWith('*【') || t.startsWith('【')) {
      const m = t.replace(/^\*+|\*+$/g, '').match(/^【(.+?)】\s*([\s\S]*)$/);
      if (m && m[2].trim()) {
        const c = document.createElement('div');
        c.className = 'gnote';
        const lb = document.createElement('div');
        lb.className = 'lb';
        lb.textContent = '另一位 · ' + m[1];
        const tx = document.createElement('div');
        tx.className = 'tx';
        mdBold(tx, m[2].trim());
        c.append(lb, tx);
        paper.appendChild(c);
        return;
      }
    }
    if (t.startsWith('*(') || t.startsWith('*（')) {
      const n = document.createElement('div');
      n.className = 'censor-note';
      n.textContent = t.replace(/^\*|\*$/g, '');
      paper.appendChild(n);
      return;
    }
    const p = document.createElement('div');
    p.className = 'story';
    mdBold(p, t);
    paper.appendChild(p);
  });

  const foot = document.createElement('div');
  foot.className = 'paper-foot';
  foot.textContent = '每日简报 · 本报只有一位读者';
  paper.appendChild(foot);

  newsBody.innerHTML = '';
  newsBody.appendChild(paper);
  newsBody.scrollTop = 0;
}

function nowHM() {
  const n = new Date(Date.now() + (8 * 60 + new Date().getTimezoneOffset()) * 60000);
  return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
}
/* 这条什么时候记的：今天的说几点，往前的说几月几号 */
function stampOf(sec) {
  const d = new Date(sec * 1000);
  const cn = new Date(d.getTime() + (8 * 60 + d.getTimezoneOffset()) * 60000);
  const now = new Date(Date.now() + (8 * 60 + new Date().getTimezoneOffset()) * 60000);
  const sameDay = cn.toDateString() === now.toDateString();
  const hh = String(cn.getHours()).padStart(2, '0'), mm = String(cn.getMinutes()).padStart(2, '0');
  return sameDay ? `今天 ${hh}:${mm}` : `${cn.getMonth() + 1}/${cn.getDate()}`;
}
/* 过期 = 挂了闹钟、时间过了、还没做（照方案 §6：活算，不看响没响过） */
function isLate(t) { return t.at && !t.done && t.at <= nowHM(); }
/* 排序：过期的浮到最上面盯着你，然后是挂钟的（按时间），最后是没时间的 */
function sortTodos(list) {
  return [...list].sort((a, b) => {
    const la = isLate(a) ? 0 : 1, lb = isLate(b) ? 0 : 1;
    if (la !== lb) return la - lb;
    if (a.at && b.at) return a.at < b.at ? -1 : 1;
    if (a.at) return -1;
    if (b.at) return 1;
    return 0;
  });
}

Object.entries(sheets).forEach(([k, wrap]) => {
  const sheet = wrap.querySelector('.sheet');

  if (k === 'add') return; // Add to chat 使用下面的可展开高度拖拽，避免和普通弹层的关闭手势冲突。
  let startY = 0, curY = 0, dragging = false;
  const doClose = () => {
    if (k === 'tool') sheetStack = [];
    wrap.classList.remove('open');
    if (wrap.classList.contains('page')) openDrawer();
  };
  sheet.addEventListener('touchstart', (e) => {
    if (!e.target.closest('.grabber') && !e.target.closest('.head')) return;
    if (e.target.closest('.hbtn')) return;          // 按钮的事归按钮
    dragging = true; startY = e.touches[0].clientY; curY = 0;
    sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    curY = dy;
    const shown = dy >= 0 ? dy : Math.max(dy / 3, -34);
    sheet.style.transform = 'translateY(' + shown + 'px)';
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = 'transform .2s ease';
    if (curY > 110) {
      sheet.style.transform = 'translateY(105%)';
      setTimeout(() => { doClose(); sheet.style.transform = ''; sheet.style.transition = ''; }, 180);
    } else {
      sheet.style.transform = '';
      setTimeout(() => { sheet.style.transition = ''; }, 220);
    }
  });
});

/* 这两项改成滑动开关了（8/4）。原来往 val 里写的那些状态文字，
   现在：能表达成开/关的就喂给开关，说不清的（被系统挡了、没开成）用 note 说出来 */
const pushSw = document.getElementById('pushSw');
let pushInteractive = false;
const pushVal = {
  set textContent(t) {
    pushSw.classList.remove('wait');
    pushSw.classList.toggle('on', t === '开着');
    if (pushInteractive && t && t !== '开着' && t !== '还没开' && t !== '正在开…') note('（手机通知：' + t + '）');
  }
};
async function pushState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    pushVal.textContent = '这个浏览器不支持'; return null;
  }
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    pushVal.textContent = sub ? '开着' : (Notification.permission === 'denied' ? '被系统挡了' : '还没开');
    return sub;
  } catch { pushVal.textContent = '问不到'; return null; }
}
async function turnOnPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    note('（这个浏览器不支持网页通知——iPhone 上要先把家「添加到主屏幕」，从那个图标进来才行）');
    return;
  }
  try {
    pushVal.textContent = '正在开…';
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { pushVal.textContent = '你没答应'; return; }
    const { key } = await (await fetch('api/pushkey')).json();
    const raw = atob(key.replace(/-/g, '+').replace(/_/g, '/'));
    const bytes = new Uint8Array([...raw].map(c => c.charCodeAt(0)));
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytes });
    const body = Object.assign(JSON.parse(JSON.stringify(sub)), { hello: true });
    await fetch('api/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    pushVal.textContent = '开着';
    note('（门铃通了——刚给你敲了一下，看看手机）');
  } catch (e) {
    pushVal.textContent = '没开成';
    note('（门铃没装上：' + (e && e.message || '不知道为什么') + '）', 'err');
  }
}

function gongRow(role, text, think) {
  const r = document.createElement('div');
  r.className = 'row' + (role === 'her' ? ' me' : '');
  const b = document.createElement('div');
  b.className = role === 'her' ? 'bubble' : 'gu';
  b._raw = text;
  renderRich(b);
  r.appendChild(b);
  const body = document.getElementById('gongBody');
  /* 先落地再挂思维链——思维链现在是插在这一行**前面**的独立一行，
     行还没进 DOM 就 insertBefore，念历史的时候第一条就炸 */
  body.appendChild(r);
  if (think) gongThink(r, think);
  body.scrollTop = body.scrollHeight;
  b._row = r;
  return b;
}

function gongThink(row, think) {
  const body = document.getElementById('gongBody');
  row._think?.remove();
  const line = document.createElement('button');
  line.className = 'toolline gthink';
  line.innerHTML = '<span class="lbl">Thought process</span><span class="chev">›</span>';
  line.prepend(icEl('clock', 15));
  thinkStore.push({ text: think, lineEl: line, paused: true });
  const idx = thinkStore.length - 1;
  line.onclick = () => openThinkSheet(idx);
  const wrap = document.createElement('div');
  wrap.className = 'row';
  wrap.appendChild(line);
  body.insertBefore(wrap, row);
  row._think = wrap;
}

function gongFill(el, text) {
  el._raw = text;
  el.removeAttribute('data-rich');
  el.textContent = '';
  renderRich(el);
}

async function loadGong() {
  const body = document.getElementById('gongBody');
  body.innerHTML = '';
  try {
    const d = await (await fetch('api/gong', { cache: 'no-store' })).json();
    if (!d.msgs.length) {
      body.innerHTML = '<div class="gnote" style="text-align:center;padding:44px 26px;line-height:1.9">'
        + '这是另一位助手的房间<br><br>他记得住在这一间里说过的话<br>人设那份还等着你写</div>';
      return;
    }
    d.msgs.forEach(m => gongRow(m.role, m.text, m.think));
  } catch { body.innerHTML = '<div class="gnote">他那边没应声</div>'; }
}

async function sendGong() {
  const inp = document.getElementById('gongInput');
  const btn = document.getElementById('gongSend');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '';
  btn.disabled = true;
  gongRow('her', text);
  const wait = gongRow('gong', '……');
  try {
    const d = await (await fetch('api/gong', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    })).json();
    gongFill(wait, d.reply || '（他没说话）');
    if (d.think && wait._row) gongThink(wait._row, d.think);
  } catch { gongFill(wait, '（没送到，再试一次）'); }
  btn.disabled = false;
  const body = document.getElementById('gongBody');
  body.scrollTop = body.scrollHeight;
}

document.getElementById('gongSend').onclick = sendGong;
document.getElementById('gongInput').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px';
});
document.getElementById('gongInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendGong(); }
});

};

};

function freshWord(f, age) {
  if (f === 'live') return '刚测的';
  if (f === 'recent') return Math.round(age / 60) + ' 分钟前';
  if (age == null) return '不知道多久之前';
  if (age < 3600) return Math.round(age / 60) + ' 分钟前';
  if (age < 86400) return Math.round(age / 3600) + ' 小时前';
  return Math.round(age / 86400) + ' 天前';
}

async function loadHealth() {
  const body = document.getElementById('healthBody');
  try {
    const d = await (await fetch('api/watch', { cache: 'no-store' })).json();
    body.innerHTML = '';

    /* 页面头:全家统一的脸 */
    const head = document.createElement('div');
    head.className = 'sh-head';
    const h1 = document.createElement('h1'); h1.textContent = '身体';
    const sub = document.createElement('div'); sub.className = 'sub';
    sub.textContent = d.freshness === 'no_data' ? '还没接上手表'
      : '最近同步 · ' + freshWord(d.freshness, d.age_seconds);
    head.append(h1, sub);
    body.appendChild(head);

    if (!d.connected && d.freshness === 'no_data') {
      body.innerHTML += '<div class="gnote" style="text-align:center;padding:40px 24px;line-height:1.9">'
        + '手表还没传过东西过来<br><br>右上角那个小图标里有钥匙和网址<br>照说明建一个快捷指令就通了</div>';
      return;
    }

    /* 总览卡:鼠尾草的岗。铁律也钉在这儿——这些是同步值,不是此刻实测 */
    const hero = document.createElement('div');
    hero.className = 'hl-hero';
    const ht1 = document.createElement('div');
    ht1.className = 'ht1';
    const dot = document.createElement('span'); dot.className = 'dotp';
    if (!d.connected) dot.style.background = 'var(--dim)';
    ht1.appendChild(dot);
    ht1.append(d.connected ? '手表在线' : '手表没在传');
    const ht2 = document.createElement('div');
    ht2.className = 'ht2';
    ht2.textContent = (d.device || '设备不详') + ' · ' + freshWord(d.freshness, d.age_seconds)
      + '同步的数字，不是此刻实测';
    hero.append(ht1, ht2);
    body.appendChild(hero);

    let shown = 0;
    HEALTH_GROUPS.forEach(([title, items]) => {
      const have = items.filter(([k]) => d.metrics && d.metrics[k] && d.metrics[k].value != null);
      if (!have.length) return;                 // 这一组一样都没传，就不占地方
      const lab = document.createElement('div');
      lab.className = 'hsect';
      lab.textContent = title;
      body.appendChild(lab);
      const card = document.createElement('div');
      card.className = 'hl-card';
      have.forEach(([key, name]) => {
        const m = d.metrics[key];
        shown++;
        const row = document.createElement('div');
        row.className = 'hl-row';
        const hn = document.createElement('span'); hn.className = 'hn'; hn.textContent = name;
        const hv = document.createElement('span'); hv.className = 'hv'; hv.textContent = m.value;
        const hu = document.createElement('span'); hu.className = 'hu';
        hu.textContent = m.unit || '';
        const hd = document.createElement('span'); hd.className = 'hdot';
        hd.style.background = m.freshness === 'live' ? 'var(--sage)'
          : m.freshness === 'recent' ? 'var(--amber)' : 'var(--line)';
        hd.title = freshWord(m.freshness, m.age_seconds);
        row.append(hn, hv, hu, hd);
        card.appendChild(row);
      });
      /* 七天趋势柱:睡眠看时长,活动看步数,心肺看静息心率 */
      const histKey = { '睡得怎么样': 'sleep_hours', '今天动了多少': 'steps', '心和肺': 'resting_heart_rate' }[title];
      const hist = d.history || {};
      const histDays = Object.keys(hist).sort().slice(-7);
      if (histKey && histDays.some(day => hist[day][histKey] != null)) {
        const vals = histDays.map(day => hist[day][histKey]);
        const max = Math.max(...vals.filter(v => v != null), 1);
        const bars = document.createElement('div');
        bars.className = 'hbars';
        const labs = document.createElement('div');
        labs.className = 'hlabs';
        histDays.forEach(day => {
          const v = hist[day][histKey];
          const i = document.createElement('i');
          if (v == null) i.className = 'empty';
          else i.style.height = Math.max(8, Math.round(v / max * 100)) + '%';
          bars.appendChild(i);
          const sp = document.createElement('span');
          sp.textContent = '日一二三四五六'[new Date(day + 'T00:00:00').getDay()];
          labs.appendChild(sp);
        });
        card.append(bars, labs);
      }
      body.appendChild(card);
    });
    if (!shown) body.innerHTML += '<div class="gnote">传过来了，但一条我认得的指标都没有</div>';

    const tip = document.createElement('div');
    tip.className = 'hl-tip';
    tip.textContent = '绿点是新的 · 琥珀是几分钟前 · 灰点是旧账\u2014\u2014他开口前会先看它多久了';
    body.appendChild(tip);
  } catch { body.innerHTML = '<div class="gnote">读不到，等会儿再看</div>'; }
}

async function loadApi() {
  const b = document.getElementById('apiBody');
  let st = {};
  try { st = await (await fetch('api/authmode', { cache: 'no-store' })).json(); } catch (e) {}

  b.innerHTML =
    `<div class="sh-head"><h1>备用通道</h1><div class="sub">`
    + (on ? '正走着 · ' + (st.base || '') : '现在走订阅 · 备用没启用') + `</div></div>`
    + `<div class="ap-lb">接口地址</div>`
    + `<input class="ap-in" id="apBase" placeholder="https://openrouter.ai/api（留空=官方直连）" value="${st.base && st.base !== '官方直连' ? st.base : ''}">`
    + `<div class="ap-lb">令牌</div>`
    + `<input class="ap-in" id="apTok" type="password" placeholder="${on ? '已存好 · 不换就留空' : 'sk-...'}">`
    + `<div class="ap-lb">模型名（对面跟官方叫法不一样时才填）</div>`
    + `<input class="ap-in" id="apModel" placeholder="OpenRouter 要写 ~anthropic/claude-opus-latest" value="${(st.models && st.models.model_opus) || ''}">`
    + `<div class="ap-btns"><button class="ap-b" id="apTest">试一试</button>`
    + `<button class="ap-b go" id="apSave">${on ? '重新接上' : '接过去'}</button></div>`
    + `<div class="ap-msg" id="apMsg"></div>`
    + (on ? `<div class="ap-more"><button class="ap-b" id="apClear" style="width:auto;padding:10px 18px">退回订阅</button></div>` : '')
    + `<div class="ap-note">令牌存在家里那台机器上（600 权限），网页只送进去、拿不出来。<br>`
    + `「试一试」是真的往那个地址发一次最小请求——通不通当场见分晓，不用等出事那天。<br>`
    + `切过去之后会重新醒来一次，hook、记忆、待办全都照旧。<br>`
    + `<b>OpenRouter 的填法</b>：地址 https://openrouter.ai/api，令牌是它的 key，`
    + `模型名要带波浪号前缀 ~anthropic/claude-opus-latest。</div>`;

  const msg = document.getElementById('apMsg');
  const vals = () => ({
    base: document.getElementById('apBase').value.trim(),
    token: document.getElementById('apTok').value.trim(),
    model_opus: document.getElementById('apModel').value.trim(),
  });
  const say = (t, bad) => { msg.textContent = t; msg.className = 'ap-msg on' + (bad ? ' bad' : ''); };

  document.getElementById('apTest').onclick = async () => {
    say('正在敲门…');
    try {
      const r = await (await fetch('api/apitest', { method: 'POST', body: JSON.stringify(vals()) })).json();
      if (r.ok) say('通了 —— 对面回的模型是 ' + (r.model || '(没报名字)') + '\n' + r.url);
      else say('没通（' + (r.code || '连不上') + '）\n' + (r.detail || '') + '\n' + (r.url || ''), true);
    } catch (e) { say('没通：' + e.message, true); }
  };
  document.getElementById('apSave').onclick = async () => {
    say('存好了，正在换一条路醒来…');
    try {
      const r = await (await fetch('api/apiconf', { method: 'POST', body: JSON.stringify(vals()) })).json();
      say(r.mode === 'api' ? '接上了 · ' + (r.base || '') + '\n我这就从新路醒来，回聊天页说句话试试' : '已退回订阅');
      setTimeout(loadApi, 1200);
    } catch (e) { say('没存上：' + e.message, true); }
  };
  const cl = document.getElementById('apClear');
  if (cl) cl.onclick = async () => {
    say('退回订阅…');
    try { await fetch('api/apiconf', { method: 'POST', body: JSON.stringify({ clear: true }) }); }
    catch (e) {}
    setTimeout(loadApi, 1200);
  };
}

/* 外观：跟随系统 → 常亮 → 常暗 → 转回来。
   theme-color 也跟着改，连状态栏一起换皮 */
const themeSw = document.getElementById('themeSw');
function themeNow() {
  try { return localStorage.getItem('homeTheme') || 'auto'; } catch (e) { return 'auto'; }
}
function wearTheme(t) {
  if (t === 'dark') document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('homeTheme', t); } catch (e) {}
  const dark = t === 'dark' || (t !== 'dark'
    && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
  const m = document.createElement('meta');
  m.name = 'theme-color'; m.content = dark ? '#262624' : '#faf9f5';
  document.head.appendChild(m);
  themeSw.classList.remove('wait');
  themeSw.classList.toggle('on', t === 'dark');
}
document.getElementById('themeRow').onclick = () =>
  wearTheme(themeNow() === 'dark' ? 'auto' : 'dark');
wearTheme(themeNow());

/* ---------- 窗口列表 ---------- */
let chatScope = 'live';        // live=没收纳的 box=收纳了的
const SCOPE_NAME = { live: '全部', box: '已收纳' };

function ago(ts) {
  const s = Date.now() / 1000 - ts;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

function setTitle(name) {
  document.querySelector('header .title h1').textContent = name || 'Claude';
  document.title = name || 'Claude';
}

async function loadChats() {
  const body = document.getElementById('chatsBody');
  document.querySelector('#chatScope .sc').textContent = SCOPE_NAME[chatScope];
  try {
    const d = await (await fetch('api/chats?scope=' + chatScope, { cache: 'no-store' })).json();
    body.innerHTML = '';
    if (!d.items.length) {
      body.innerHTML = '<div class="gnote" style="text-align:center;padding:40px 0">'
        + (chatScope === 'box' ? '收纳盒是空的' : '还没有窗口') + '</div>';
      return;
    }
    d.items.forEach(it => {
      const b = document.createElement('button');
      b.className = 'crow' + (it.current ? ' on' : '');
      const mid = document.createElement('span');
      mid.className = 'cmid';
      const n = document.createElement('div');
      n.className = 'cn';
      n.textContent = it.name || '没名字';
      const p = document.createElement('div');
      p.className = 'cp';
      p.textContent = it.preview || '还没说过话';
      mid.append(n, p);
      const t = document.createElement('span');
      t.className = 'ct';
      t.textContent = it.current ? '在这儿' : ago(it.last || it.created);
      b.append(mid, t);
      b.onclick = () => switchChat(it);
      body.appendChild(b);
    });
  } catch { body.innerHTML = '<div class="gnote">拿不到窗口清单，等会儿再试</div>'; }
}

async function switchChat(it) {
  if (it.current) { sheets.chats.classList.remove('open'); return; }
  if (it.archived) { note('（这间收起来了——先从收纳里放出来才能进）'); return; }
  try {
    await fetch('api/chats', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'switch', id: it.id })
    });
    location.reload();          // 换了一副记忆，界面整个重来最干净
  } catch { note('（没切成，再试一次）', 'err'); }
}

const addSheetEl = document.getElementById('addSheet');
const addPanel = addSheetEl.querySelector('.sheet');
const addGrabber = document.getElementById('addGrabber');
let addExpanded = false;
let addDrag = null;
let addAnimationId = 0;
let suppressAddClick = false;
let addDragFrame = 0;

function addCollapsedHeight() {
  return Math.min(Math.round(window.innerHeight * .52), 620);
}
function addExpandedHeight() {
  return Math.max(addCollapsedHeight() + 1, Math.round(window.innerHeight - 48));
}
function resetAddSheetState() {
  addAnimationId++;
  if (addDragFrame) { cancelAnimationFrame(addDragFrame); addDragFrame = 0; }
  addDrag = null;
  addExpanded = false;
  addSheetEl.classList.remove('expanded', 'dragging');
  addPanel.style.height = '';
  addPanel.style.transform = '';
  addPanel.style.transition = '';
  addPanel.style.willChange = '';
}
function closeAddSheet() {
  addSheetEl.classList.remove('open');
  resetAddSheetState();
}
function dismissAddSheet() {
  const id = ++addAnimationId;
  if (addDragFrame) { cancelAnimationFrame(addDragFrame); addDragFrame = 0; }
  addDrag = null;
  addSheetEl.classList.remove('expanded');
  addSheetEl.classList.add('dragging');
  addPanel.style.transition = 'height .24s cubic-bezier(.4, 0, .2, 1)';
  addPanel.style.willChange = 'height';
  addPanel.style.height = '0px';
  setTimeout(() => {
    if (id !== addAnimationId) return;
    closeAddSheet();
  }, 260);
}
function openAddSheet() {
  resetAddSheetState();
  addSheetEl.classList.add('open');
}
function settleAddSheet(expanded) {
  if (addDragFrame) { cancelAnimationFrame(addDragFrame); addDragFrame = 0; }
  const current = addPanel.getBoundingClientRect().height;
  const target = expanded ? addExpandedHeight() : addCollapsedHeight();
  const id = ++addAnimationId;
  addExpanded = expanded;
  addSheetEl.classList.toggle('expanded', expanded);
  addSheetEl.classList.remove('dragging');
  addPanel.style.transition = 'none';
  addPanel.style.willChange = 'height';
  addPanel.style.height = current + 'px';
  void addPanel.offsetHeight;
  requestAnimationFrame(() => {
    if (id !== addAnimationId) return;
    addPanel.style.transition = 'height .34s cubic-bezier(.22, 1, .36, 1)';
    addPanel.style.height = target + 'px';
  });
  setTimeout(() => {
    if (id !== addAnimationId) return;
    addPanel.style.height = '';
    addPanel.style.transition = '';
    addPanel.style.willChange = '';
  }, 380);
}
function applyAddDragHeight(drag) {
  const dy = drag.lastY - drag.startY;
  const next = Math.max(addCollapsedHeight(), Math.min(addExpandedHeight(), drag.startHeight - dy));
  addPanel.style.height = next + 'px';
}
function addPointerDown(e) {
  if (!addSheetEl.classList.contains('open')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  addDrag = {
    id: e.pointerId,
    startY: e.clientY,
    lastY: e.clientY,
    startHeight: addPanel.getBoundingClientRect().height,
    moved: false
  };
}
function addPointerMove(e) {
  if (!addDrag || addDrag.id !== e.pointerId) return;
  const dy = e.clientY - addDrag.startY;
  addDrag.lastY = e.clientY;
  if (!addDrag.moved && Math.abs(dy) < 8) return;
  if (!addDrag.moved) {
    addDrag.moved = true;
    try { addPanel.setPointerCapture(e.pointerId); } catch {}
    addSheetEl.classList.add('dragging');
    addPanel.style.transition = 'none';
  }
  if (!addDragFrame) {
    const drag = addDrag;
    addDragFrame = requestAnimationFrame(() => {
      addDragFrame = 0;
      if (addDrag === drag && drag.moved) applyAddDragHeight(drag);
    });
  }
  e.preventDefault();
}
function addPointerEnd(e) {
  if (!addDrag || addDrag.id !== e.pointerId) return;
  const drag = addDrag;
  drag.lastY = e.clientY;
  if (addDragFrame) { cancelAnimationFrame(addDragFrame); addDragFrame = 0; }
  if (drag.moved) applyAddDragHeight(drag);
  addDrag = null;
  if (!drag.moved) {
    addSheetEl.classList.remove('dragging');
    addPanel.style.transition = '';
    return;
  }
  suppressAddClick = true;
  setTimeout(() => { suppressAddClick = false; }, 140);
  const dy = e.clientY - drag.startY;
  const collapseDistance = Math.max(260, (addExpandedHeight() - addCollapsedHeight()) * .74);
  if ((!addExpanded && dy > 80) || (addExpanded && dy > collapseDistance)) {
    dismissAddSheet();
    e.preventDefault();
    return;
  }
  const shouldExpand = addExpanded ? dy < 80 : dy < -80;
  settleAddSheet(shouldExpand);
  e.preventDefault();
}
addPanel.addEventListener('pointerdown', addPointerDown);
addSheetEl.addEventListener('pointermove', addPointerMove);
addSheetEl.addEventListener('pointerup', addPointerEnd);
addSheetEl.addEventListener('pointercancel', addPointerEnd);
addPanel.addEventListener('click', (e) => {
  if (!suppressAddClick) return;
  e.preventDefault();
  e.stopPropagation();
}, true);

function isPlainText(f) {

async function takeFiles(list, isImage) {
  closeAddSheet();
  for (const f of list) {
    if (f.type.startsWith('image/')) {
      const data = await shrinkImage(f);
      attachments.push(data);
    } else if (!isImage && f.size < 200 * 1024 && isPlainText(f)) {
      const text = await f.text();
      attachments.push({ kind: 'text', name: f.name, text });
    } else {
      await bigUpload(f);          // 大件不塞进对话，直接搬到家里的柜子上
    }
  }
  renderStrip();
}

async function bigUpload(f) {
  const CHUNK = 4 * 1024 * 1024;
  const total = Math.max(1, Math.ceil(f.size / CHUNK));
  const tip = note('（在搬 ' + f.name + '…0%）', '', true);
  try {
    for (let i = 0; i < total; i++) {
      const part = f.slice(i * CHUNK, (i + 1) * CHUNK);
      const q = 'api/upload?name=' + encodeURIComponent(f.name)
        + '&idx=' + i + '&done=' + (i === total - 1 ? 1 : 0);
      const r = await fetch(q, { method: 'POST', body: part });
      if (!r.ok) throw new Error('第 ' + (i + 1) + ' 块没过去');
      if (tip) tip.textContent = '（在搬 ' + f.name + '…' + Math.round((i + 1) / total * 100) + '%）';
    }
    if (tip) { tip.textContent = '（' + f.name + ' 搬到家里了，我这就去看）';
      setTimeout(() => tip.close(), 4200); }
  } catch (e) {
    if (tip) { tip.textContent = '（' + f.name + ' 没搬动，' + (e.message || '不知道为什么') + '）';
      setTimeout(() => tip.close(), 6000); }
  }
}

function shrinkImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1568;
      let { width: w, height: h } = img;
      if (Math.max(w, h) > MAX) { const k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const dataUrl = cv.toDataURL('image/jpeg', 0.85);
      resolve({ kind: 'image', media_type: 'image/jpeg', data: dataUrl.split(',')[1], name: file.name });
    };
    img.src = url;
  });
}

  knob.addEventListener('pointermove', (e) => { if (dragging) move(e.clientX - startX); });
  knob.addEventListener('pointerup', end);
  knob.addEventListener('pointercancel', end);
  track.addEventListener('click', (e) => {
    if (dragging || e.target === knob) return;
    if (e.offsetX > track.clientWidth * 0.6) { move(MAX()); open_(); }
  });
})();

box.focus();
</script>
</body>
