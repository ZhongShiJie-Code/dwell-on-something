plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.xinwithyu.dwell'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xinwithyu.dwell'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.6.0'
    }

    sourceSets {
        main {
            // Package the existing frontend as-is; no second copy can drift from web/.
            assets.srcDirs = [file('../../web')]
        }
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('DWELL_RELEASE_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('DWELL_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('DWELL_RELEASE_KEY_ALIAS') ?: 'dwell'
                keyPassword System.getenv('DWELL_RELEASE_KEY_PASSWORD') ?: System.getenv('DWELL_RELEASE_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('DWELL_RELEASE_KEYSTORE')) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.navigation:navigation-compose:2.9.0'

    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    kapt 'androidx.room:room-compiler:2.7.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'androidx.webkit:webkit:1.13.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.05.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

kapt {
    arguments {
        arg('room.schemaLocation', "$projectDir/schemas")
    }
}
