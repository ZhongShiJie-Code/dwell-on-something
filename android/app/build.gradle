plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xinwithyu.dwell'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xinwithyu.dwell'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.1'
    }

    sourceSets {
        main {
            // Package the existing frontend as-is; no second copy can drift from web/.
            assets.srcDirs = [file('../../web')]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
